<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhizomium Live Viewer - Smooth 60 FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            display: block;
            image-rendering: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #status {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            color: #ffa500;
        }

        #status.connected {
            color: #00ff00;
        }

        #status.error {
            color: #ff0000;
        }

        #info {
            font-size: 14px;
            color: #aaa;
            margin-top: 20px;
        }

        #controls {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #333;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat {
            font-size: 14px;
            color: #aaa;
        }

        .stat strong {
            color: #fff;
        }

        button {
            background: #444;
            border: 1px solid #666;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.primary {
            background: #007acc;
            border-color: #005a9e;
        }

        button.primary:hover {
            background: #005a9e;
        }

        .banner {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            padding: 10px 20px;
            text-align: center;
            font-size: 13px;
            display: block !important;
            color: #000;
        }

        .banner strong {
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        /* UI hiding styles */
        body.ui-hidden .banner,
        body.ui-hidden #controls,
        body.ui-hidden #stats-overlay,
        body.ui-hidden #ui-hint {
            display: none !important;
        }

        body.ui-hidden #canvas-container {
            height: 100vh !important;
        }

        #ui-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0.6;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
            display: block !important;
        }

        #ui-hint:hover {
            opacity: 1;
        }

        /* Stats overlay */
        #stats-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            z-index: 50;
            display: flex !important;
            gap: 15px;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="banner">
            <strong>⚡ Live Shader Viewer</strong> - Real-time 60 FPS WebGPU rendering
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="overlay">
                <div id="status" class="pulse">Initializing WebGPU...</div>
                <div id="info">
                    Open the <strong>Editor</strong> and click<br>
                    <strong>"Open Live Viewer"</strong> to start streaming
                </div>
            </div>
        </div>

        <div id="controls">
            <div class="control-group">
                <button id="btn-hide-ui">Hide UI (H)</button>
                <button id="btn-fullscreen">Fullscreen (F)</button>
                <button id="btn-refresh">Refresh</button>
            </div>
        </div>

        <!-- Stats overlay -->
        <div id="stats-overlay">
            <div class="stat">Render FPS: <strong id="render-fps">0</strong></div>
            <div class="stat">Frame: <strong id="resolution">...</strong></div>
            <div class="stat">Display: <strong id="display-size">...</strong></div>
            <div class="stat">Messages: <strong id="msg-count">0</strong></div>
        </div>

        <div id="ui-hint">Press H to hide UI • Press F for fullscreen</div>
    </div>

    <script type="module">
        // Check WebGPU support
        if (!navigator.gpu) {
            document.getElementById('status').textContent = 'WebGPU not supported';
            document.getElementById('status').classList.add('error');
            document.getElementById('status').classList.remove('pulse');
            document.getElementById('info').innerHTML =
                'Your browser doesn\'t support WebGPU.<br>' +
                'Please use Chrome 113+, Edge 113+, or another WebGPU-enabled browser.';
            throw new Error('WebGPU not supported');
        }

        // Check BroadcastChannel support
        if (!('BroadcastChannel' in window)) {
            document.getElementById('status').textContent = 'BroadcastChannel not supported';
            document.getElementById('status').classList.add('error');
            document.getElementById('status').classList.remove('pulse');
            document.getElementById('info').innerHTML =
                'Your browser doesn\'t support BroadcastChannel API.<br>' +
                'Please use Chrome, Edge, Firefox, or Safari.';
            throw new Error('BroadcastChannel not supported');
        }

        class LiveShaderViewer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.channel = new BroadcastChannel('rhizo-live-shader-stream');

                // WebGPU state
                this.device = null;
                this.context = null;
                this.pipeline = null;
                this.bindGroups = [];
                this.resources = {};
                this.format = null;

                // Shader state
                this.currentShader = null;
                this.uniformValues = new Map();
                this.uniformValuesArray = [];
                this.uniformKeys = []; // Maps array index -> "nodeId.paramName"

                // Compute nodes state
                this.computeNodes = [];
                this.computePipelines = new Map();
                this.computeOutputs = new Map();

                // Fragment nodes state (for fragment→compute workflows)
                this.fragmentNodes = [];
                this.fragmentPipelines = new Map();
                this.fragmentOutputs = new Map();

                // Node output values for parameter reference evaluation (e.g., =node_14)
                // Maps node ID -> output value (number or array)
                this.nodeOutputValues = new Map();

                // Animation state
                this.animationId = null;
                this.isRunning = false;
                this.startTime = performance.now();
                this.syncedTime = null; // Time synced from main editor

                // Statistics
                this.frameCount = 0;
                this.lastFPSUpdate = 0;
                this.fps = 0;
                this.msgCount = 0;
                this.hasReceivedShader = false;

                // Resolution tracking
                this.currentWidth = 1920;
                this.currentHeight = 1080;

                // Shader request retry mechanism
                this.shaderRequestRetryCount = 0;
                this.shaderRequestRetryTimer = null;

                this._setupEventListeners();
                this._init();
            }

            _setupEventListeners() {
                // Channel messages
                this.channel.onmessage = (event) => {
                    this.handleMessage(event.data);
                };

                // UI buttons
                document.getElementById('btn-hide-ui').addEventListener('click', () => {
                    this.toggleUI();
                });
                document.getElementById('btn-fullscreen').addEventListener('click', () => {
                    this.toggleFullscreen();
                });
                document.getElementById('btn-refresh').addEventListener('click', () => location.reload());

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'h' || e.key === 'H') {
                        e.preventDefault();
                        this.toggleUI();
                    } else if (e.key === 'f' || e.key === 'F') {
                        e.preventDefault();
                        this.toggleFullscreen();
                    }
                });

                // Auto-resize canvas
                window.addEventListener('resize', () => this.updateCanvasDisplaySize());

                // Cleanup on window unload
                window.addEventListener('beforeunload', () => {
                    if (this.shaderRequestRetryTimer) {
                        clearInterval(this.shaderRequestRetryTimer);
                        this.shaderRequestRetryTimer = null;
                    }
                });
            }

            async _init() {
                try {
                    // Initialize WebGPU
                    const adapter = await navigator.gpu.requestAdapter();
                    if (!adapter) {
                        throw new Error('No GPU adapter found');
                    }

                    this.device = await adapter.requestDevice();
                    this.context = this.canvas.getContext('webgpu');
                    this.format = navigator.gpu.getPreferredCanvasFormat();

                    this.context.configure({
                        device: this.device,
                        format: this.format,
                        alphaMode: 'premultiplied',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
                    });

                    // Set initial canvas size
                    this.canvas.width = this.currentWidth;
                    this.canvas.height = this.currentHeight;
                    this.updateCanvasDisplaySize();

                    this.setStatus('Waiting for shader...', 'pulse');
                    document.getElementById('info').innerHTML =
                        'WebGPU initialized!<br>Waiting for shader from editor...';

                    // Request shader from editor with retry mechanism
                    this.requestShaderWithRetry();

                } catch (error) {
                    console.error('[LiveViewer] Initialization error:', error);
                    this.setStatus('WebGPU initialization failed', 'error');
                    document.getElementById('info').textContent = error.message;
                }
            }

            handleMessage(data) {
                if (!data || !data.type) return;

                this.msgCount++;
                document.getElementById('msg-count').textContent = this.msgCount;

                const { type } = data;

                if (type === 'shader_update') {
                    this.handleShaderUpdate(data);
                } else if (type === 'uniform_update') {
                    this.handleUniformUpdate(data);
                } else if (type === 'parameter_update') {
                    this.handleParameterUpdate(data);
                } else if (type === 'resolution_update') {
                    this.handleResolutionUpdate(data);
                }
            }

            handleShaderUpdate(data) {
                const { shaderCode, uniformValues, uniformKeys, resolution, computeNodes, fragmentNodes, nodeOutputValues, audioEnvelope } = data;

                if (!shaderCode) {
                    console.error('[LiveViewer] No shader code received!');
                    return;
                }

                // Store uniform keys for mapping array indices to node parameters
                if (uniformKeys && Array.isArray(uniformKeys)) {
                    this.uniformKeys = uniformKeys;
                    console.log('[LiveViewer] Received', uniformKeys.length, 'parameter mappings');
                }

                // Store node output values for parameter reference evaluation (e.g., =node_14)
                if (nodeOutputValues && typeof nodeOutputValues === 'object') {
                    this.nodeOutputValues.clear();
                    for (const [nodeId, value] of Object.entries(nodeOutputValues)) {
                        this.nodeOutputValues.set(nodeId, value);
                    }
                    console.log('[LiveViewer] Received', this.nodeOutputValues.size, 'node output values for parameter references');
                }

                // Stop retry timer since we received a shader
                if (this.shaderRequestRetryTimer) {
                    clearInterval(this.shaderRequestRetryTimer);
                    this.shaderRequestRetryTimer = null;
                    console.log('[LiveViewer] Shader received, stopped retry timer');
                }

                if (!this.hasReceivedShader) {
                    this.hasReceivedShader = true;
                    document.getElementById('overlay').classList.add('hidden');
                }

                // Update resolution if provided
                if (resolution) {
                    this.currentWidth = resolution.width;
                    this.currentHeight = resolution.height;
                    this.canvas.width = this.currentWidth;
                    this.canvas.height = this.currentHeight;
                    
                    // Reconfigure WebGPU context to match new canvas size
                    if (this.context && this.device) {
                        this.context.configure({
                            device: this.device,
                            format: this.format,
                            alphaMode: 'premultiplied',
                            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
                        });
                    }
                    
                    this.updateCanvasDisplaySize();
                }

                // Update uniform values (now an array)
                if (uniformValues && Array.isArray(uniformValues)) {
                    this.uniformValuesArray = uniformValues;
                }

                // Initialize fragment nodes if provided (BEFORE compute nodes!)
                if (fragmentNodes && Array.isArray(fragmentNodes)) {
                    console.log(`[LiveViewer] Received ${fragmentNodes.length} fragment nodes`);
                    this.initializeFragmentNodes(fragmentNodes);
                }

                // Initialize compute nodes if provided
                if (computeNodes && Array.isArray(computeNodes)) {
                    console.log(`[LiveViewer] Received ${computeNodes.length} compute nodes`);
                    this.initializeComputeNodes(computeNodes);
                }

                // Update audio envelope values if provided (from initial shader update)
                // CRITICAL: This allows audioEnvelope expressions to work in the external viewer
                if (audioEnvelope && typeof audioEnvelope === 'object') {
                    window._audioEnvelopeValue = audioEnvelope.audioEnvelope || 0.0;
                    window._audioEnvelopeBass = audioEnvelope.audioEnvelopeBass || 0.0;
                    window._audioEnvelopeMids = audioEnvelope.audioEnvelopeMids || 0.0;
                    window._audioEnvelopeHighs = audioEnvelope.audioEnvelopeHighs || 0.0;
                    window._audioEnvelopeFull = audioEnvelope.audioEnvelopeFull || 0.0;
                    console.log('[LiveViewer] Initialized audio envelope values:', {
                        audioEnvelope: window._audioEnvelopeValue.toFixed(3),
                        bass: window._audioEnvelopeBass.toFixed(3),
                        mids: window._audioEnvelopeMids.toFixed(3),
                        highs: window._audioEnvelopeHighs.toFixed(3),
                        full: window._audioEnvelopeFull.toFixed(3)
                    });
                }

                // Compile shader
                this.compileShader(shaderCode);

                // Start rendering if not already running
                if (!this.isRunning) {
                    this.startRendering();
                }
            }

            handleUniformUpdate(data) {
                const { uniformName, value } = data;
                this.uniformValues.set(uniformName, value);
            }

            handleResolutionUpdate(data) {
                const { width, height } = data;
                this.currentWidth = width;
                this.currentHeight = height;
                this.canvas.width = width;
                this.canvas.height = height;
                
                // Reconfigure WebGPU context to match new canvas size
                if (this.context && this.device) {
                    this.context.configure({
                        device: this.device,
                        format: this.format,
                        alphaMode: 'premultiplied',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
                    });
                }
                
                this.updateCanvasDisplaySize();

                // Recompile shader with new resolution
                if (this.currentShader) {
                    this.compileShader(this.currentShader);
                }
            }

            handleParameterUpdate(data) {
                const { uniformValues, uniformKeys, computeNodeParams, audioEnvelope, nodeOutputValues, time } = data;

                // Update uniformKeys if provided (they may change if new parameters are added)
                if (uniformKeys && Array.isArray(uniformKeys)) {
                    this.uniformKeys = uniformKeys;
                }

                // CRITICAL: Update node output values when parameters change
                // This ensures that when a node with expressions (time/audio) changes,
                // nodes that reference it (e.g., =node_X) get updated values
                if (nodeOutputValues && typeof nodeOutputValues === 'object') {
                    for (const [nodeId, value] of Object.entries(nodeOutputValues)) {
                        this.nodeOutputValues.set(nodeId, value);
                    }
                    if (this.paramUpdateCount <= 3) {
                        console.log('[LiveViewer] Updated', Object.keys(nodeOutputValues).length, 'node output values from parameter update');
                    }
                }

                // Update parameter values if provided
                if (uniformValues && Array.isArray(uniformValues)) {
                    // Check if values actually changed (for debugging)
                    const valuesChanged = this.uniformValuesArray.length !== uniformValues.length || 
                                         !this.uniformValuesArray.every((val, idx) => val === uniformValues[idx]);
                    
                    this.uniformValuesArray = uniformValues;

                    // CRITICAL: Update compute node params directly from uniformValuesArray
                    // Compute nodes use their own uniform buffer, not u_params, so their parameters
                    // need to be updated directly in the nodeData.params object
                    // Use uniformKeys from the message (if provided) or fall back to stored uniformKeys
                    const keysToUse = uniformKeys || this.uniformKeys;
                    if (keysToUse && keysToUse.length > 0 && uniformValues.length > 0) {
                        let computeNodeUpdates = 0;
                        for (let i = 0; i < Math.min(keysToUse.length, uniformValues.length); i++) {
                            const key = keysToUse[i];
                            if (!key || typeof key !== 'string') continue;
                            
                            const dotIndex = key.indexOf('.');
                            if (dotIndex === -1) continue;
                            
                            const keyNodeId = key.substring(0, dotIndex);
                            const paramName = key.substring(dotIndex + 1);
                            const value = uniformValues[i];
                            
                            // Update compute node params if this key belongs to a compute node
                            for (const nodeData of this.computeNodes) {
                                const normalizedKeyNodeId = String(keyNodeId).replace(/[^a-zA-Z0-9_]/g, '_');
                                const normalizedNodeId = String(nodeData.nodeId).replace(/[^a-zA-Z0-9_]/g, '_');
                                
                                if (keyNodeId === String(nodeData.nodeId) || normalizedKeyNodeId === normalizedNodeId) {
                                    // Update the node's params object directly
                                    if (!nodeData.params) {
                                        nodeData.params = {};
                                    }
                                    const oldValue = nodeData.params[paramName];
                                    
                                    // CRITICAL: Don't overwrite expression strings with numeric values from uniformValuesArray
                                    // Expression strings like "=time*20" must be preserved for evaluation each frame
                                    const isExpression = typeof oldValue === 'string' && 
                                        (oldValue.trim().startsWith('=') || /\btime\b/.test(oldValue) || /\baudioEnvelope/.test(oldValue));
                                    
                                    if (!isExpression) {
                                        // Safe to update with numeric value (not overwriting an expression)
                                        // Ensure value is a number (not a string)
                                        const numValue = typeof value === 'number' ? value : parseFloat(value);
                                        if (!isNaN(numValue)) {
                                            nodeData.params[paramName] = numValue;
                                            computeNodeUpdates++;
                                            
                                            // DEBUG: Log first few updates for ComputeTransform
                                            if (nodeData.kind === 'ComputeTransform' && computeNodeUpdates <= 3) {
                                                console.log(`[LiveViewer] Updated ${nodeData.nodeId}.${paramName}: ${oldValue} -> ${numValue}`);
                                            }
                                        }
                                    } else {
                                        // Preserve expression string - don't overwrite with numeric value from uniformValuesArray
                                        // The expression will be evaluated in executeComputeNode using _evaluateParam
                                        if (this.paramUpdateCount <= 3) {
                                            console.log(`[LiveViewer] Preserved expression for ${nodeData.nodeId}.${paramName}: "${oldValue}" (ignoring numeric update: ${value})`);
                                        }
                                    }
                                }
                            }
                            
                            // CRITICAL: Also preserve expression strings for fragment nodes
                            // Fragment nodes need expression strings preserved so they can be re-evaluated each frame
                            for (const nodeData of this.fragmentNodes) {
                                const normalizedKeyNodeId = String(keyNodeId).replace(/[^a-zA-Z0-9_]/g, '_');
                                const normalizedNodeId = String(nodeData.nodeId).replace(/[^a-zA-Z0-9_]/g, '_');
                                
                                if (keyNodeId === String(nodeData.nodeId) || normalizedKeyNodeId === normalizedNodeId) {
                                    // Ensure params object exists
                                    if (!nodeData.params) {
                                        nodeData.params = {};
                                    }
                                    const oldValue = nodeData.params[paramName];
                                    
                                    // CRITICAL: Don't overwrite expression strings with numeric values
                                    const isExpression = typeof oldValue === 'string' && 
                                        (oldValue.trim().startsWith('=') || /\btime\b/.test(oldValue) || /\baudioEnvelope/.test(oldValue));
                                    
                                    if (isExpression) {
                                        // Preserve expression string - it will be re-evaluated each frame in updateFragmentUniforms
                                        if (this.paramUpdateCount <= 3) {
                                            console.log(`[LiveViewer] Preserved fragment expression for ${nodeData.nodeId}.${paramName}: "${oldValue}"`);
                                        }
                                    }
                                    // Note: We don't update fragment node params with numeric values here
                                    // because fragment nodes use uniformValuesArray directly in updateFragmentUniforms
                                    // The expression strings just need to be preserved so they can be detected and re-evaluated
                                }
                            }
                        }
                        
                        // DEBUG: Log if we found compute node parameters to update
                        if (computeNodeUpdates > 0 && this.paramUpdateCount <= 3) {
                            console.log(`[LiveViewer] Updated ${computeNodeUpdates} compute node parameters from uniformValuesArray`);
                        } else if (this.paramUpdateCount <= 3) {
                            // DEBUG: Log if no compute node parameters were found (to diagnose the issue)
                            const computeNodeIds = this.computeNodes.map(n => n.nodeId);
                            const computeNodeKeys = keysToUse.filter(k => {
                                if (!k || typeof k !== 'string') return false;
                                const dotIndex = k.indexOf('.');
                                if (dotIndex === -1) return false;
                                const keyNodeId = k.substring(0, dotIndex);
                                return computeNodeIds.includes(String(keyNodeId));
                            });
                            if (computeNodeKeys.length === 0 && this.computeNodes.length > 0) {
                                console.warn(`[LiveViewer] No compute node parameters found in uniformKeys. Compute nodes: ${computeNodeIds.join(', ')}, uniformKeys: ${keysToUse.slice(0, 5).join(', ')}...`);
                            }
                        }
                    }
                    
                    // CRITICAL: Update compute node params directly from computeNodeParams if provided
                    // This handles the case where compute node parameters aren't in uniformKeys
                    if (computeNodeParams && computeNodeParams.nodeId && computeNodeParams.params) {
                        // DEBUG: Log receipt of computeNodeParams
                        if (this.paramUpdateCount <= 3) {
                            console.log('[LiveViewer] Received computeNodeParams:', computeNodeParams);
                        }
                        
                        for (const nodeData of this.computeNodes) {
                            if (String(nodeData.nodeId) === String(computeNodeParams.nodeId)) {
                                // Update the node's params object directly
                                if (!nodeData.params) {
                                    nodeData.params = {};
                                }
                                // Merge the new params, ensuring numeric values
                                // CRITICAL: Handle boolean parameters (like colorize) correctly
                                let updatedCount = 0;
                                for (const [paramName, value] of Object.entries(computeNodeParams.params)) {
                                    let processedValue;
                                    
                                    // Handle boolean parameters (preserve as boolean, will be converted to 1.0/0.0 when packing uniforms)
                                    if (typeof value === 'boolean') {
                                        processedValue = value;
                                    } else if (typeof value === 'number') {
                                        processedValue = value;
                                    } else if (typeof value === 'string') {
                                        const trimmed = value.trim();
                                        // CRITICAL: Check if it's an expression (starts with = or contains time/audioEnvelope)
                                        // If it's an expression, keep it as a string so it can be evaluated every frame
                                        const isExpression = trimmed.startsWith('=') || /\btime\b/.test(trimmed) || /\baudioEnvelope/.test(trimmed);
                                        if (isExpression) {
                                            processedValue = value; // Keep expression string for evaluation
                                        } else {
                                            // Try to parse as number first
                                            const parsed = parseFloat(trimmed);
                                            if (!isNaN(parsed)) {
                                                processedValue = parsed;
                                            } else {
                                                // Handle boolean strings
                                                const str = trimmed.toLowerCase();
                                                if (str === 'true' || str === 'false') {
                                                    processedValue = str === 'true';
                                                } else {
                                                    processedValue = value; // Keep as string if can't parse
                                                }
                                            }
                                        }
                                    } else {
                                        processedValue = value; // Keep original value
                                    }
                                    
                                    const oldValue = nodeData.params[paramName];
                                    nodeData.params[paramName] = processedValue;
                                    updatedCount++;
                                    
                                    // DEBUG: Log first few updates
                                    if (this.paramUpdateCount <= 3) {
                                        console.log(`[LiveViewer] Updated ${nodeData.nodeId}.${paramName} from computeNodeParams: ${oldValue} -> ${processedValue} (type: ${typeof processedValue})`);
                                    }
                                }
                                
                                if (updatedCount > 0 && this.paramUpdateCount <= 3) {
                                    console.log(`[LiveViewer] Updated ${updatedCount} params for compute node ${nodeData.nodeId}`);
                                }
                                break;
                            }
                        }
                    } else if (this.paramUpdateCount <= 3 && this.computeNodes.length > 0) {
                        // DEBUG: Log if computeNodeParams not received but compute nodes exist
                        console.log('[LiveViewer] No computeNodeParams received, compute nodes:', this.computeNodes.map(n => n.nodeId));
                    }

                    // DEBUG: Log updates during drag to verify they're being received
                    this.paramUpdateCount = (this.paramUpdateCount || 0) + 1;
                    if (this.paramUpdateCount <= 5 || this.paramUpdateCount % 60 === 0) {
                        console.log('[Viewer] Received parameter update #', this.paramUpdateCount, 
                                   'changed:', valuesChanged, 'values:', uniformValues.slice(0, 3));
                    }
                    
                    // CRITICAL: Parameter updates are now in uniformValuesArray
                    // The render loop (running at 60fps) will pick them up on the next frame
                    // executeComputeNodes() uses _extractNodeParams() which reads from uniformValuesArray
                    // So updates should appear within 1 frame (~16ms at 60fps)
                    
                    // Force immediate render to ensure real-time updates during parameter drag
                    // This ensures parameter changes are visible immediately, not just on next frame
                    // CRITICAL: For compute nodes, we need to ensure compute execution happens immediately
                    if (this.isRunning) {
                        // Cancel any pending render to avoid duplicate renders
                        if (this._renderScheduled) {
                            cancelAnimationFrame(this._scheduledRenderId);
                            this._renderScheduled = false;
                        }
                        
                        // Schedule immediate render - use requestAnimationFrame for proper timing
                        // but mark it so we know a render is pending
                        this._renderScheduled = true;
                        this._scheduledRenderId = requestAnimationFrame(() => {
                            this._renderScheduled = false;
                            if (this.isRunning) {
                                // Force render with latest parameter values
                                // This will execute compute nodes with the updated parameters
                                // The render() function will:
                                // 1. Execute fragment nodes
                                // 2. Execute compute nodes (which will use the updated uniformValuesArray)
                                // 3. Render the final shader
                                this.render();
                            }
                        });
                    }
                }

                // Update audio envelope values if provided
                // CRITICAL: This allows audioEnvelope expressions to work in the external viewer
                if (audioEnvelope && typeof audioEnvelope === 'object') {
                    window._audioEnvelopeValue = audioEnvelope.audioEnvelope || 0.0;
                    window._audioEnvelopeBass = audioEnvelope.audioEnvelopeBass || 0.0;
                    window._audioEnvelopeMids = audioEnvelope.audioEnvelopeMids || 0.0;
                    window._audioEnvelopeHighs = audioEnvelope.audioEnvelopeHighs || 0.0;
                    window._audioEnvelopeFull = audioEnvelope.audioEnvelopeFull || 0.0;
                    
                    // DEBUG: Log first few updates to verify audio envelope is being received
                    if (this.paramUpdateCount <= 3) {
                        console.log('[LiveViewer] Updated audio envelope values:', {
                            audioEnvelope: window._audioEnvelopeValue.toFixed(3),
                            bass: window._audioEnvelopeBass.toFixed(3),
                            mids: window._audioEnvelopeMids.toFixed(3),
                            highs: window._audioEnvelopeHighs.toFixed(3),
                            full: window._audioEnvelopeFull.toFixed(3)
                        });
                    }
                }
            }

            requestShaderWithRetry() {
                // Clear any existing retry timer
                if (this.shaderRequestRetryTimer) {
                    clearInterval(this.shaderRequestRetryTimer);
                }

                // Send initial request immediately
                console.log('[LiveViewer] Requesting shader from editor...');
                this.channel.postMessage({
                    type: 'request_shader',
                    timestamp: Date.now()
                });

                // Set up retry timer - request every 2 seconds until shader is received
                this.shaderRequestRetryCount = 0;
                this.shaderRequestRetryTimer = setInterval(() => {
                    if (this.hasReceivedShader) {
                        clearInterval(this.shaderRequestRetryTimer);
                        this.shaderRequestRetryTimer = null;
                        return;
                    }

                    this.shaderRequestRetryCount++;
                    console.log(`[LiveViewer] Retrying shader request (attempt ${this.shaderRequestRetryCount})...`);

                    this.channel.postMessage({
                        type: 'request_shader',
                        timestamp: Date.now()
                    });

                    // Update status to show we're still waiting
                    if (this.shaderRequestRetryCount > 2) {
                        document.getElementById('info').innerHTML =
                            'Still waiting for shader from editor...<br>' +
                            'Make sure the editor is open and click "Open External Viewer"';
                    }
                }, 2000);
            }

            initializeFragmentNodes(fragmentNodes) {
                try {
                    this.fragmentNodes = fragmentNodes;
                    this.fragmentPipelines.clear();
                    this.fragmentOutputs.clear();

                    // Initialize each fragment node
                    for (const nodeData of fragmentNodes) {
                        this.initializeFragmentNode(nodeData);
                    }

                    console.log(`[LiveViewer] Initialized ${fragmentNodes.length} fragment nodes`);
                    console.log('[LiveViewer] Fragment output keys:', Array.from(this.fragmentOutputs.keys()));
                } catch (error) {
                    console.error('[LiveViewer] Error initializing fragment nodes:', error);
                }
            }

            initializeFragmentNode(nodeData) {
                const { nodeId, wgslCode, params, parameterValues } = nodeData;

                try {
                    console.log(`[LiveViewer] Initializing fragment node ${nodeId}`);

                    // Create shader module
                    const shaderModule = this.device.createShaderModule({
                        code: wgslCode,
                        label: `fragment-${nodeId}`
                    });

                    // Create output texture (use current resolution)
                    const width = this.currentWidth;
                    const height = this.currentHeight;

                    const outputTexture = this.device.createTexture({
                        size: [width, height, 1],
                        format: 'rgba8unorm',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC
                    });

                    // Analyze bindings from shader (similar to FragmentTextureRenderer)
                    const bindingMap = this.analyzeFragmentBindings(wgslCode);

                    // Create bind group resources
                    const { layouts, bindGroups, uniformBuffers } = this.createFragmentBindResources(
                        bindingMap,
                        parameterValues
                    );

                    // Create pipeline layout
                    const pipelineLayout = this.device.createPipelineLayout({
                        bindGroupLayouts: layouts
                    });

                    // Create render pipeline
                    const pipeline = this.device.createRenderPipeline({
                        layout: pipelineLayout,
                        vertex: {
                            module: shaderModule,
                            entryPoint: 'vs_main'
                        },
                        fragment: {
                            module: shaderModule,
                            entryPoint: 'fs_main',
                            targets: [{ format: 'rgba8unorm' }]
                        },
                        primitive: {
                            topology: 'triangle-list'
                        }
                    });

                    // Create sampler for this texture
                    const sampler = this.device.createSampler({
                        magFilter: 'linear',
                        minFilter: 'linear',
                        addressModeU: 'repeat',
                        addressModeV: 'repeat'
                    });

                    // Store pipeline and output texture
                    this.fragmentPipelines.set(nodeId, {
                        pipeline: pipeline,
                        bindGroups: bindGroups,
                        uniformBuffers: uniformBuffers,
                        bindingMap: bindingMap,
                        layouts: layouts,
                        nodeData: nodeData
                    });

                    this.fragmentOutputs.set(nodeId, {
                        texture: outputTexture,
                        sampler: sampler,
                        width: width,
                        height: height
                    });

                    console.log(`[LiveViewer] Initialized fragment node ${nodeId} (${width}x${height})`);
                } catch (error) {
                    console.error(`[LiveViewer] Error initializing fragment node ${nodeId}:`, error);
                    console.error(`[LiveViewer] WGSL code:`, wgslCode);
                }
            }

            initializeComputeNodes(computeNodes) {
                try {
                    this.computeNodes = computeNodes;
                    this.computePipelines.clear();
                    this.computeOutputs.clear();

                    // Initialize each compute node
                    for (const nodeData of computeNodes) {
                        // CRITICAL: Preserve expression strings in params - they come from the editor
                        // The params object should contain expression strings like "time*20" or "=time*20"
                        // Check and log expression params for debugging
                        if (nodeData.params) {
                            for (const [paramName, paramValue] of Object.entries(nodeData.params)) {
                                if (typeof paramValue === 'string') {
                                    const trimmed = paramValue.trim();
                                    const isExpression = trimmed.startsWith('=') || /\btime\b/.test(trimmed) || /\baudioEnvelope/.test(trimmed);
                                    if (isExpression && (nodeData.kind === 'ComputeTransform' || nodeData.nodeId === '28')) {
                                        console.log(`[LiveViewer] Initializing ${nodeData.nodeId}.${paramName} with expression: "${paramValue}"`);
                                    }
                                }
                            }
                        }
                        this.initializeComputeNode(nodeData);
                    }

                    console.log(`[LiveViewer] Initialized ${computeNodes.length} compute nodes`);
                    console.log('[LiveViewer] Compute output keys:', Array.from(this.computeOutputs.keys()));
                } catch (error) {
                    console.error('[LiveViewer] Error initializing compute nodes:', error);
                }
            }

            initializeComputeNode(nodeData) {
                const { nodeId, wgslCode, resolution, inputs } = nodeData;

                try {
                    // Log node info including inputs
                    console.log(`[LiveViewer] Initializing compute node ${nodeId} (${nodeData.kind}) with inputs:`, inputs);
                    if (nodeData.kind === 'ComputeWarp' && inputs && inputs.length >= 2) {
                        console.log(`[LiveViewer] ComputeWarp node ${nodeId}: Input 0 (texture) = ${inputs[0]}, Input 1 (warp field) = ${inputs[1]}`);
                    }

                    // CRITICAL: Ensure default params are set correctly for compute nodes
                    // Some parameters like 'colorize' have defaults that must be preserved
                    if (!nodeData.params) {
                        nodeData.params = {};
                    }
                    
                    // Set default values for specific node types if params are missing
                    if (nodeData.kind === 'ComputeNoise') {
                        // ComputeNoise default: colorize should be true (colorized)
                        if (nodeData.params.colorize === undefined || nodeData.params.colorize === null) {
                            nodeData.params.colorize = true;
                        }
                    }

                    // Determine if this node supports feedback (ping-pong textures)
                    const feedbackNodes = ['ComputeReactionDiffusion', 'ComputeCellular', 'ComputeFeedback', 'ComputeFeedbackField'];
                    const supportsFeedback = feedbackNodes.includes(nodeData.kind);

                    // Create shader module
                    const shaderModule = this.device.createShaderModule({
                        code: wgslCode,
                        label: `compute-${nodeId}`
                    });

                    // Create output texture
                    const width = resolution[0];
                    const height = resolution[1];

                    let outputTexture;
                    let storageTextureA = null;
                    let storageTextureB = null;
                    let currentWriteTexture = 'A';

                    if (supportsFeedback) {
                        // Create ping-pong textures for feedback
                        storageTextureA = this.device.createTexture({
                            size: [width, height, 1],
                            format: 'rgba8unorm',
                            usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC | GPUTextureUsage.COPY_DST,
                            label: `feedback-A-${nodeId}`
                        });

                        storageTextureB = this.device.createTexture({
                            size: [width, height, 1],
                            format: 'rgba8unorm',
                            usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC | GPUTextureUsage.COPY_DST,
                            label: `feedback-B-${nodeId}`
                        });

                        // Output texture is the current write texture (starts with A)
                        outputTexture = storageTextureA;

                        console.log(`[LiveViewer] Created ping-pong feedback textures for ${nodeId}`);
                    } else {
                        // Single output texture for non-feedback nodes
                        outputTexture = this.device.createTexture({
                            size: [width, height, 1],
                            format: 'rgba8unorm',
                            usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC
                        });
                    }

                    // Create uniform buffer for compute parameters
                    const uniformBuffer = this.device.createBuffer({
                        size: 256, // Large enough for parameters
                        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                    });

                    // Create sampler for input textures
                    const sampler = this.device.createSampler({
                        magFilter: 'linear',
                        minFilter: 'linear',
                        addressModeU: 'repeat',
                        addressModeV: 'repeat'
                    });

                    // Store output texture
                    this.computeOutputs.set(nodeId, {
                        texture: outputTexture,
                        sampler: sampler,
                        uniformBuffer: uniformBuffer,
                        width: width,
                        height: height
                    });

                    // Create compute pipeline (will be done on first dispatch)
                    this.computePipelines.set(nodeId, {
                        shaderModule: shaderModule,
                        outputTexture: outputTexture,
                        uniformBuffer: uniformBuffer,
                        sampler: sampler,
                        nodeData: nodeData,
                        supportsFeedback: supportsFeedback,
                        storageTextureA: storageTextureA,
                        storageTextureB: storageTextureB,
                        currentWriteTexture: currentWriteTexture
                    });

                    console.log(`[LiveViewer] Initialized compute node ${nodeId} (${width}x${height})${supportsFeedback ? ' with feedback support' : ''}`);
                } catch (error) {
                    console.error(`[LiveViewer] Error initializing compute node ${nodeId}:`, error);
                }
            }

            executeFragmentNodes(time) {
                if (this.fragmentNodes.length === 0) {
                    return;
                }

                try {
                    const encoder = this.device.createCommandEncoder({ label: 'fragment-encoder' });

                    // Execute each fragment node in order
                    for (const nodeData of this.fragmentNodes) {
                        this.executeFragmentNode(encoder, nodeData, time);
                    }

                    this.device.queue.submit([encoder.finish()]);
                } catch (error) {
                    console.error('[LiveViewer] Error executing fragment nodes:', error);
                }
            }

            executeFragmentNode(encoder, nodeData, time) {
                const { nodeId } = nodeData;
                const pipelineData = this.fragmentPipelines.get(nodeId);
                const outputData = this.fragmentOutputs.get(nodeId);

                if (!pipelineData || !outputData) {
                    return;
                }

                try {
                    const { pipeline, bindGroups, uniformBuffers } = pipelineData;
                    const { texture, width, height } = outputData;

                    // Update uniform buffers before rendering
                    this.updateFragmentUniforms(uniformBuffers, time, width, height, nodeData);

                    // Begin render pass
                    const pass = encoder.beginRenderPass({
                        colorAttachments: [{
                            view: texture.createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear',
                            storeOp: 'store'
                        }]
                    });

                    pass.setPipeline(pipeline);

                    // Bind all bind groups
                    for (let i = 0; i < bindGroups.length; i++) {
                        pass.setBindGroup(i, bindGroups[i]);
                    }

                    // Draw fullscreen triangle
                    pass.draw(3, 1, 0, 0);
                    pass.end();

                } catch (error) {
                    console.error(`[LiveViewer] Error executing fragment node ${nodeId}:`, error);
                }
            }

            updateFragmentUniforms(uniformBuffers, time, width, height, nodeData) {
                // Update aspect uniform (u)
                const aspectBuffer = uniformBuffers.get('u');
                if (aspectBuffer) {
                    const aspectData = new Float32Array([width / height, 0, 0, 0]);
                    this.device.queue.writeBuffer(aspectBuffer, 0, aspectData);
                }

                // Update globals uniform (g)
                const globalsBuffer = uniformBuffers.get('g');
                if (globalsBuffer) {
                    // Get all audio envelope values from window (set by BrowserAudioCapture)
                    const audioEnvelope = window._audioEnvelopeValue || 0.0;
                    const audioEnvelopeBass = window._audioEnvelopeBass || 0.0;
                    const audioEnvelopeMids = window._audioEnvelopeMids || 0.0;
                    const audioEnvelopeHighs = window._audioEnvelopeHighs || 0.0;
                    const audioEnvelopeFull = window._audioEnvelopeFull || 0.0;
                    
                    const globalsData = new Float32Array([
                        width,
                        height,
                        time,
                        audioEnvelope,
                        audioEnvelopeBass,
                        audioEnvelopeMids,
                        audioEnvelopeHighs,
                        audioEnvelopeFull
                    ]);
                    this.device.queue.writeBuffer(globalsBuffer, 0, globalsData);
                }

                // Update parameter uniforms (u_params)
                // CRITICAL: Use uniformValuesArray for real-time parameter updates during drag
                // This ensures fragment node parameters update immediately, not just on shader recompile
                const paramsBuffer = uniformBuffers.get('u_params');
                if (paramsBuffer) {
                    // Check if any parameters are expressions (time/audioEnvelope) that need re-evaluation each frame
                    const hasExpressions = nodeData.params && Object.values(nodeData.params).some(value => {
                        if (typeof value === 'string') {
                            const trimmed = value.trim();
                            return trimmed.startsWith('=') || /\btime\b/.test(trimmed) || /\baudioEnvelope/.test(trimmed);
                        }
                        return false;
                    });
                    
                    // DEBUG: Log expression detection
                    if (hasExpressions && (!this._fragmentExpressionDebug || this._fragmentExpressionDebug < 5)) {
                        this._fragmentExpressionDebug = (this._fragmentExpressionDebug || 0) + 1;
                        const expressionParams = Object.entries(nodeData.params || {}).filter(([k, v]) => 
                            typeof v === 'string' && (v.trim().startsWith('=') || /\btime\b/.test(v) || /\baudioEnvelope/.test(v))
                        );
                        console.log(`[LiveViewer] Fragment node ${nodeData.nodeId} has expressions:`, expressionParams);
                    }
                    
                    if (hasExpressions) {
                        // Re-evaluate expressions each frame using nodeData.params
                        // CRITICAL: Preserve original expression strings from nodeData.params
                        // Don't use _extractNodeParams as it overwrites expressions with numeric values
                        const evaluatedValues = [];
                        
                        // Build evaluated values array matching uniformKeys order
                        if (this.uniformKeys && this.uniformKeys.length > 0) {
                            for (let i = 0; i < this.uniformKeys.length; i++) {
                                const key = this.uniformKeys[i];
                                if (!key || typeof key !== 'string') {
                                    evaluatedValues.push(0);
                                    continue;
                                }
                                
                                const dotIndex = key.indexOf('.');
                                if (dotIndex === -1) {
                                    evaluatedValues.push(0);
                                    continue;
                                }
                                
                                const keyNodeId = key.substring(0, dotIndex);
                                const paramName = key.substring(dotIndex + 1);
                                
                                // Check if this key belongs to our node
                                const normalizedKeyNodeId = String(keyNodeId).replace(/[^a-zA-Z0-9_]/g, '_');
                                const normalizedNodeId = String(nodeData.nodeId).replace(/[^a-zA-Z0-9_]/g, '_');
                                
                                if (keyNodeId === String(nodeData.nodeId) || normalizedKeyNodeId === normalizedNodeId) {
                                    // CRITICAL: Get original parameter value from nodeData.params (preserves expression strings)
                                    // Only use uniformValuesArray if the param is NOT an expression
                                    let paramValue = nodeData.params?.[paramName];
                                    const isExpression = typeof paramValue === 'string' && 
                                        (paramValue.trim().startsWith('=') || /\btime\b/.test(paramValue) || /\baudioEnvelope/.test(paramValue));
                                    
                                    if (!isExpression && this.uniformValuesArray && this.uniformValuesArray[i] !== undefined) {
                                        // Not an expression - use live value from uniformValuesArray for real-time updates
                                        paramValue = this.uniformValuesArray[i];
                                    }
                                    
                                    // DEBUG: Log expression evaluation
                                    if (isExpression && (!this._fragmentEvalDebug || this._fragmentEvalDebug < 10)) {
                                        this._fragmentEvalDebug = (this._fragmentEvalDebug || 0) + 1;
                                        const audioEnv = window._audioEnvelopeValue || 0.0;
                                        console.log(`[LiveViewer] Evaluating fragment expression ${nodeData.nodeId}.${paramName}: "${paramValue}", audioEnvelope=${audioEnv.toFixed(3)}`);
                                    }
                                    
                                    const defaultValue = typeof paramValue === 'number' ? paramValue : 0.0;
                                    // Re-evaluate expression each frame (or use numeric value if not expression)
                                    const evaluated = this._evaluateParam(paramValue, defaultValue, time);
                                    
                                    // DEBUG: Log evaluation result
                                    if (isExpression && (!this._fragmentEvalResultDebug || this._fragmentEvalResultDebug < 10)) {
                                        this._fragmentEvalResultDebug = (this._fragmentEvalResultDebug || 0) + 1;
                                        console.log(`[LiveViewer] Expression result: ${evaluated}`);
                                    }
                                    
                                    evaluatedValues.push(evaluated);
                                } else {
                                    // Use value from uniformValuesArray for other nodes
                                    evaluatedValues.push(this.uniformValuesArray && this.uniformValuesArray[i] !== undefined ? this.uniformValuesArray[i] : 0);
                                }
                            }
                            
                            const data = new Float32Array(evaluatedValues);
                            const writeSize = Math.min(data.byteLength, paramsBuffer.size);
                            if (writeSize > 0) {
                                this.device.queue.writeBuffer(paramsBuffer, 0, data.buffer, 0, writeSize);
                            }
                        } else if (nodeData.parameterValues && nodeData.parameterValues.length > 0) {
                            // Fallback: evaluate expressions from params and merge with parameterValues
                            const data = new Float32Array(nodeData.parameterValues);
                            // TODO: Map params to parameterValues indices - for now use parameterValues
                            const writeSize = Math.min(data.byteLength, paramsBuffer.size);
                            if (writeSize > 0) {
                                this.device.queue.writeBuffer(paramsBuffer, 0, data.buffer, 0, writeSize);
                            }
                        }
                    } else {
                        // No expressions - use pre-evaluated values from uniformValuesArray
                        if (this.uniformValuesArray && this.uniformValuesArray.length > 0 && 
                            this.uniformKeys && this.uniformKeys.length > 0) {
                            // Use live parameter values from uniformValuesArray
                            const data = new Float32Array(this.uniformValuesArray);
                            const writeSize = Math.min(data.byteLength, paramsBuffer.size);
                            if (writeSize > 0) {
                                this.device.queue.writeBuffer(paramsBuffer, 0, data.buffer, 0, writeSize);
                            } else {
                                console.warn(`[LiveViewer] Fragment u_params buffer too small: need ${data.byteLength} bytes, have ${paramsBuffer.size} bytes`);
                            }
                        } else if (nodeData.parameterValues && nodeData.parameterValues.length > 0) {
                            // Fallback to static parameterValues if uniformValuesArray not available
                            const data = new Float32Array(nodeData.parameterValues);
                            const writeSize = Math.min(data.byteLength, paramsBuffer.size);
                            if (writeSize > 0) {
                                this.device.queue.writeBuffer(paramsBuffer, 0, data.buffer, 0, writeSize);
                            }
                        }
                    }
                }
            }

            executeComputeNodes(time) {
                if (this.computeNodes.length === 0) {
                    return;
                }

                try {
                    const encoder = this.device.createCommandEncoder({ label: 'compute-encoder' });

                    // CRITICAL: Topologically sort compute nodes to ensure dependencies execute first
                    // This is especially important for nodes like ComputeWarp that have multiple inputs
                    const executionOrder = this._topologicalSortComputeNodes(this.computeNodes);
                    
                    // Log execution order for debugging
                    if (executionOrder.length > 1) {
                        const orderIds = executionOrder.map(n => `${n.nodeId}(${n.kind})`).join(' -> ');
                        console.log(`[LiveViewer] Compute node execution order: ${orderIds}`);
                    }
                    
                    // Execute each compute node in dependency order
                    for (const nodeData of executionOrder) {
                        this.executeComputeNode(encoder, nodeData, time);
                    }

                    this.device.queue.submit([encoder.finish()]);
                } catch (error) {
                    console.error('[LiveViewer] Error executing compute nodes:', error);
                }
            }

            /**
             * Topologically sort compute nodes to ensure dependencies execute before dependents
             * This ensures that nodes like ComputeWarp's second input (warp field) are executed first
             */
            _topologicalSortComputeNodes(computeNodes) {
                if (computeNodes.length <= 1) {
                    return computeNodes;
                }

                // Build a map of nodeId -> nodeData for quick lookup
                const nodeMap = new Map();
                for (const nodeData of computeNodes) {
                    nodeMap.set(String(nodeData.nodeId), nodeData);
                }

                // Build dependency graph: nodeId -> Set of dependency nodeIds
                const dependencies = new Map();
                for (const nodeData of computeNodes) {
                    const nodeId = String(nodeData.nodeId);
                    const deps = new Set();
                    
                    // Check all inputs (including second input for nodes like ComputeWarp)
                    if (nodeData.inputs && Array.isArray(nodeData.inputs)) {
                        for (const inputId of nodeData.inputs) {
                            if (inputId !== null && inputId !== undefined) {
                                const inputNodeId = String(inputId);
                                // Only add as dependency if it's a compute node
                                if (nodeMap.has(inputNodeId)) {
                                    deps.add(inputNodeId);
                                }
                            }
                        }
                    }
                    
                    dependencies.set(nodeId, deps);
                }

                // Topological sort using DFS
                const visited = new Set();
                const visiting = new Set();
                const result = [];

                const visit = (nodeId) => {
                    if (visited.has(nodeId)) {
                        return;
                    }

                    if (visiting.has(nodeId)) {
                        // Circular dependency detected, skip
                        console.warn(`[LiveViewer] Circular dependency detected for compute node ${nodeId}`);
                        return;
                    }

                    visiting.add(nodeId);
                    
                    // Visit dependencies first
                    const deps = dependencies.get(nodeId) || new Set();
                    for (const depId of deps) {
                        visit(depId);
                    }
                    
                    visiting.delete(nodeId);
                    visited.add(nodeId);
                    
                    // Add to result
                    const nodeData = nodeMap.get(nodeId);
                    if (nodeData) {
                        result.push(nodeData);
                    }
                };

                // Visit all nodes
                for (const nodeData of computeNodes) {
                    visit(String(nodeData.nodeId));
                }

                return result;
            }

            /**
             * Evaluate a parameter value - handles expressions, shader variables, and static values
             * Similar to ComputeShaderManager.evaluateParam but for the external viewer
             * @param {*} value - The parameter value (could be number, string expression, etc.)
             * @param {number} defaultValue - Default value if evaluation fails
             * @param {number} time - Current time for expression evaluation
             * @returns {number} The evaluated numeric value
             */
            _evaluateParam(value, defaultValue, time) {
                // If already a number, return it
                if (typeof value === 'number') {
                    return isFinite(value) ? value : defaultValue;
                }

                // If it's a string, it might be an expression
                if (typeof value === 'string') {
                    const trimmed = value.trim();

                    // Check if it's an expression (either starts with = or contains time/audioEnvelope/node references)
                    const isExpression = trimmed.startsWith('=') || /\btime\b/.test(trimmed) || /\baudioEnvelope/.test(trimmed) || /node_\d+/.test(trimmed);

                    // Handle expressions (with or without = prefix)
                    if (isExpression) {
                        try {
                            // Remove = prefix if present
                            let expression = trimmed.startsWith('=') ? trimmed.slice(1).trim() : trimmed;

                            // CRITICAL: Handle node references (e.g., node_14, node_14_x, node_14_y)
                            // Replace node references with their actual output values
                            expression = this._resolveNodeReferences(expression);

                            // Build evaluation context with time and node outputs
                            // Get all audio envelope values from window (set by BrowserAudioCapture)
                            const audioEnvelope = window._audioEnvelopeValue || 0.0;
                            const audioEnvelopeBass = window._audioEnvelopeBass || 0.0;
                            const audioEnvelopeMids = window._audioEnvelopeMids || 0.0;
                            const audioEnvelopeHighs = window._audioEnvelopeHighs || 0.0;
                            const audioEnvelopeFull = window._audioEnvelopeFull || 0.0;
                            
                            const context = {
                                time: time,
                                audioEnvelope: audioEnvelope,
                                audioEnvelopeBass: audioEnvelopeBass,
                                audioEnvelopeMids: audioEnvelopeMids,
                                audioEnvelopeHighs: audioEnvelopeHighs,
                                audioEnvelopeFull: audioEnvelopeFull
                            };

                            // Replace sin, cos, tan, etc. with Math.sin, Math.cos, Math.tan, etc.
                            // This allows expressions like "sin(time)" to work correctly
                            expression = expression
                                .replace(/\bsin\(/g, 'Math.sin(')
