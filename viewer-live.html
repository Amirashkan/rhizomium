<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhizomium Live Viewer - Smooth 60 FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            display: block;
            image-rendering: auto;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #status {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            color: #ffa500;
        }

        #status.connected {
            color: #00ff00;
        }

        #status.error {
            color: #ff0000;
        }

        #info {
            font-size: 14px;
            color: #aaa;
            margin-top: 20px;
        }

        #controls {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #333;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat {
            font-size: 14px;
            color: #aaa;
        }

        .stat strong {
            color: #fff;
        }

        button {
            background: #444;
            border: 1px solid #666;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.primary {
            background: #007acc;
            border-color: #005a9e;
        }

        button.primary:hover {
            background: #005a9e;
        }

        .banner {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            padding: 10px 20px;
            text-align: center;
            font-size: 13px;
            display: block !important;
            color: #000;
        }

        .banner strong {
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        /* UI hiding styles */
        body.ui-hidden .banner,
        body.ui-hidden #controls,
        body.ui-hidden #stats-overlay,
        body.ui-hidden #ui-hint {
            display: none !important;
        }

        body.ui-hidden #canvas-container {
            height: 100vh !important;
        }

        #ui-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0.6;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
            display: block !important;
        }

        #ui-hint:hover {
            opacity: 1;
        }

        /* Stats overlay */
        #stats-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            z-index: 50;
            display: flex !important;
            gap: 15px;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="banner">
            <strong>⚡ Live Shader Viewer</strong> - Real-time 60 FPS WebGPU rendering
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="overlay">
                <div id="status" class="pulse">Initializing WebGPU...</div>
                <div id="info">
                    Open the <strong>Editor</strong> and click<br>
                    <strong>"Open Live Viewer"</strong> to start streaming
                </div>
            </div>
        </div>

        <div id="controls">
            <div class="control-group">
                <button id="btn-hide-ui">Hide UI (H)</button>
                <button id="btn-fullscreen">Fullscreen (F)</button>
                <button id="btn-refresh">Refresh</button>
            </div>
        </div>

        <!-- Stats overlay -->
        <div id="stats-overlay">
            <div class="stat">Render FPS: <strong id="render-fps">0</strong></div>
            <div class="stat">Frame: <strong id="resolution">...</strong></div>
            <div class="stat">Display: <strong id="display-size">...</strong></div>
            <div class="stat">Messages: <strong id="msg-count">0</strong></div>
        </div>

        <div id="ui-hint">Press H to hide UI • Press F for fullscreen</div>
    </div>

    <script type="module">
        // Check WebGPU support
        if (!navigator.gpu) {
            document.getElementById('status').textContent = 'WebGPU not supported';
            document.getElementById('status').classList.add('error');
            document.getElementById('status').classList.remove('pulse');
            document.getElementById('info').innerHTML =
                'Your browser doesn\'t support WebGPU.<br>' +
                'Please use Chrome 113+, Edge 113+, or another WebGPU-enabled browser.';
            throw new Error('WebGPU not supported');
        }

        // Check BroadcastChannel support
        if (!('BroadcastChannel' in window)) {
            document.getElementById('status').textContent = 'BroadcastChannel not supported';
            document.getElementById('status').classList.add('error');
            document.getElementById('status').classList.remove('pulse');
            document.getElementById('info').innerHTML =
                'Your browser doesn\'t support BroadcastChannel API.<br>' +
                'Please use Chrome, Edge, Firefox, or Safari.';
            throw new Error('BroadcastChannel not supported');
        }

        class LiveShaderViewer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.channel = new BroadcastChannel('rhizo-live-shader-stream');

                // WebGPU state
                this.device = null;
                this.context = null;
                this.pipeline = null;
                this.bindGroups = [];
                this.resources = {};
                this.format = null;

                // Shader state
                this.currentShader = null;
                this.uniformValues = new Map();
                this.uniformValuesArray = [];
                this.uniformKeys = []; // Maps array index -> "nodeId.paramName"

                // Compute nodes state
                this.computeNodes = [];
                this.computePipelines = new Map();
                this.computeOutputs = new Map();

                // Fragment nodes state (for fragment→compute workflows)
                this.fragmentNodes = [];
                this.fragmentPipelines = new Map();
                this.fragmentOutputs = new Map();

                // Animation state
                this.animationId = null;
                this.isRunning = false;
                this.startTime = performance.now();
                this.syncedTime = null; // Time synced from main editor

                // Statistics
                this.frameCount = 0;
                this.lastFPSUpdate = 0;
                this.fps = 0;
                this.msgCount = 0;
                this.hasReceivedShader = false;

                // Resolution tracking
                this.currentWidth = 1920;
                this.currentHeight = 1080;

                // Shader request retry mechanism
                this.shaderRequestRetryCount = 0;
                this.shaderRequestRetryTimer = null;

                this._setupEventListeners();
                this._init();
            }

            _setupEventListeners() {
                // Channel messages
                this.channel.onmessage = (event) => {
                    this.handleMessage(event.data);
                };

                // UI buttons
                document.getElementById('btn-hide-ui').addEventListener('click', () => {
                    this.toggleUI();
                });
                document.getElementById('btn-fullscreen').addEventListener('click', () => {
                    this.toggleFullscreen();
                });
                document.getElementById('btn-refresh').addEventListener('click', () => location.reload());

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'h' || e.key === 'H') {
                        e.preventDefault();
                        this.toggleUI();
                    } else if (e.key === 'f' || e.key === 'F') {
                        e.preventDefault();
                        this.toggleFullscreen();
                    }
                });

                // Auto-resize canvas
                window.addEventListener('resize', () => this.updateCanvasDisplaySize());

                // Cleanup on window unload
                window.addEventListener('beforeunload', () => {
                    if (this.shaderRequestRetryTimer) {
                        clearInterval(this.shaderRequestRetryTimer);
                        this.shaderRequestRetryTimer = null;
                    }
                });
            }

            async _init() {
                try {
                    // Initialize WebGPU
                    const adapter = await navigator.gpu.requestAdapter();
                    if (!adapter) {
                        throw new Error('No GPU adapter found');
                    }

                    this.device = await adapter.requestDevice();
                    this.context = this.canvas.getContext('webgpu');
                    this.format = navigator.gpu.getPreferredCanvasFormat();

                    this.context.configure({
                        device: this.device,
                        format: this.format,
                        alphaMode: 'premultiplied',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
                    });

                    // Set initial canvas size
                    this.canvas.width = this.currentWidth;
                    this.canvas.height = this.currentHeight;
                    this.updateCanvasDisplaySize();

                    this.setStatus('Waiting for shader...', 'pulse');
                    document.getElementById('info').innerHTML =
                        'WebGPU initialized!<br>Waiting for shader from editor...';

                    // Request shader from editor with retry mechanism
                    this.requestShaderWithRetry();

                } catch (error) {
                    console.error('[LiveViewer] Initialization error:', error);
                    this.setStatus('WebGPU initialization failed', 'error');
                    document.getElementById('info').textContent = error.message;
                }
            }

            handleMessage(data) {
                if (!data || !data.type) return;

                this.msgCount++;
                document.getElementById('msg-count').textContent = this.msgCount;

                const { type } = data;

                if (type === 'shader_update') {
                    this.handleShaderUpdate(data);
                } else if (type === 'uniform_update') {
                    this.handleUniformUpdate(data);
                } else if (type === 'parameter_update') {
                    this.handleParameterUpdate(data);
                } else if (type === 'resolution_update') {
                    this.handleResolutionUpdate(data);
                }
            }

            handleShaderUpdate(data) {
                const { shaderCode, uniformValues, uniformKeys, resolution, computeNodes, fragmentNodes } = data;

                if (!shaderCode) {
                    console.error('[LiveViewer] No shader code received!');
                    return;
                }

                // Store uniform keys for mapping array indices to node parameters
                if (uniformKeys && Array.isArray(uniformKeys)) {
                    this.uniformKeys = uniformKeys;
                    console.log('[LiveViewer] Received', uniformKeys.length, 'parameter mappings');
                }

                // Stop retry timer since we received a shader
                if (this.shaderRequestRetryTimer) {
                    clearInterval(this.shaderRequestRetryTimer);
                    this.shaderRequestRetryTimer = null;
                    console.log('[LiveViewer] Shader received, stopped retry timer');
                }

                if (!this.hasReceivedShader) {
                    this.hasReceivedShader = true;
                    document.getElementById('overlay').classList.add('hidden');
                }

                // Update resolution if provided
                if (resolution) {
                    this.currentWidth = resolution.width;
                    this.currentHeight = resolution.height;
                    this.canvas.width = this.currentWidth;
                    this.canvas.height = this.currentHeight;
                    this.updateCanvasDisplaySize();
                }

                // Update uniform values (now an array)
                if (uniformValues && Array.isArray(uniformValues)) {
                    this.uniformValuesArray = uniformValues;
                }

                // Initialize fragment nodes if provided (BEFORE compute nodes!)
                if (fragmentNodes && Array.isArray(fragmentNodes)) {
                    console.log(`[LiveViewer] Received ${fragmentNodes.length} fragment nodes`);
                    this.initializeFragmentNodes(fragmentNodes);
                }

                // Initialize compute nodes if provided
                if (computeNodes && Array.isArray(computeNodes)) {
                    console.log(`[LiveViewer] Received ${computeNodes.length} compute nodes`);
                    this.initializeComputeNodes(computeNodes);
                }

                // Compile shader
                this.compileShader(shaderCode);

                // Start rendering if not already running
                if (!this.isRunning) {
                    this.startRendering();
                }
            }

            handleUniformUpdate(data) {
                const { uniformName, value } = data;
                this.uniformValues.set(uniformName, value);
            }

            handleResolutionUpdate(data) {
                const { width, height } = data;
                this.currentWidth = width;
                this.currentHeight = height;
                this.canvas.width = width;
                this.canvas.height = height;
                this.updateCanvasDisplaySize();

                // Recompile shader with new resolution
                if (this.currentShader) {
                    this.compileShader(this.currentShader);
                }
            }

            handleParameterUpdate(data) {
                const { uniformValues, time } = data;

                // Update parameter values if provided
                if (uniformValues && Array.isArray(uniformValues)) {
                    this.uniformValuesArray = uniformValues;

                    // DEBUG: Log every 60th update
                    this.paramUpdateCount = (this.paramUpdateCount || 0) + 1;
                    if (this.paramUpdateCount % 60 === 0) {
                        console.log('[Viewer] Received parameter update #', this.paramUpdateCount, 'values:', uniformValues.slice(0, 3));
                    }
                }

                // Update synced time if provided
                if (typeof time === 'number') {
                    this.syncedTime = time;
                }
            }

            requestShaderWithRetry() {
                // Clear any existing retry timer
                if (this.shaderRequestRetryTimer) {
                    clearInterval(this.shaderRequestRetryTimer);
                }

                // Send initial request immediately
                console.log('[LiveViewer] Requesting shader from editor...');
                this.channel.postMessage({
                    type: 'request_shader',
                    timestamp: Date.now()
                });

                // Set up retry timer - request every 2 seconds until shader is received
                this.shaderRequestRetryCount = 0;
                this.shaderRequestRetryTimer = setInterval(() => {
                    if (this.hasReceivedShader) {
                        clearInterval(this.shaderRequestRetryTimer);
                        this.shaderRequestRetryTimer = null;
                        return;
                    }

                    this.shaderRequestRetryCount++;
                    console.log(`[LiveViewer] Retrying shader request (attempt ${this.shaderRequestRetryCount})...`);

                    this.channel.postMessage({
                        type: 'request_shader',
                        timestamp: Date.now()
                    });

                    // Update status to show we're still waiting
                    if (this.shaderRequestRetryCount > 2) {
                        document.getElementById('info').innerHTML =
                            'Still waiting for shader from editor...<br>' +
                            'Make sure the editor is open and click "Open External Viewer"';
                    }
                }, 2000);
            }

            initializeFragmentNodes(fragmentNodes) {
                try {
                    this.fragmentNodes = fragmentNodes;
                    this.fragmentPipelines.clear();
                    this.fragmentOutputs.clear();

                    // Initialize each fragment node
                    for (const nodeData of fragmentNodes) {
                        this.initializeFragmentNode(nodeData);
                    }

                    console.log(`[LiveViewer] Initialized ${fragmentNodes.length} fragment nodes`);
                    console.log('[LiveViewer] Fragment output keys:', Array.from(this.fragmentOutputs.keys()));
                } catch (error) {
                    console.error('[LiveViewer] Error initializing fragment nodes:', error);
                }
            }

            initializeFragmentNode(nodeData) {
                const { nodeId, wgslCode, params, parameterValues } = nodeData;

                try {
                    console.log(`[LiveViewer] Initializing fragment node ${nodeId}`);

                    // Create shader module
                    const shaderModule = this.device.createShaderModule({
                        code: wgslCode,
                        label: `fragment-${nodeId}`
                    });

                    // Create output texture (use current resolution)
                    const width = this.currentWidth;
                    const height = this.currentHeight;

                    const outputTexture = this.device.createTexture({
                        size: [width, height, 1],
                        format: 'rgba8unorm',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC
                    });

                    // Analyze bindings from shader (similar to FragmentTextureRenderer)
                    const bindingMap = this.analyzeFragmentBindings(wgslCode);

                    // Create bind group resources
                    const { layouts, bindGroups, uniformBuffers } = this.createFragmentBindResources(
                        bindingMap,
                        parameterValues
                    );

                    // Create pipeline layout
                    const pipelineLayout = this.device.createPipelineLayout({
                        bindGroupLayouts: layouts
                    });

                    // Create render pipeline
                    const pipeline = this.device.createRenderPipeline({
                        layout: pipelineLayout,
                        vertex: {
                            module: shaderModule,
                            entryPoint: 'vs_main'
                        },
                        fragment: {
                            module: shaderModule,
                            entryPoint: 'fs_main',
                            targets: [{ format: 'rgba8unorm' }]
                        },
                        primitive: {
                            topology: 'triangle-list'
                        }
                    });

                    // Create sampler for this texture
                    const sampler = this.device.createSampler({
                        magFilter: 'linear',
                        minFilter: 'linear',
                        addressModeU: 'repeat',
                        addressModeV: 'repeat'
                    });

                    // Store pipeline and output texture
                    this.fragmentPipelines.set(nodeId, {
                        pipeline: pipeline,
                        bindGroups: bindGroups,
                        uniformBuffers: uniformBuffers,
                        bindingMap: bindingMap,
                        layouts: layouts,
                        nodeData: nodeData
                    });

                    this.fragmentOutputs.set(nodeId, {
                        texture: outputTexture,
                        sampler: sampler,
                        width: width,
                        height: height
                    });

                    console.log(`[LiveViewer] Initialized fragment node ${nodeId} (${width}x${height})`);
                } catch (error) {
                    console.error(`[LiveViewer] Error initializing fragment node ${nodeId}:`, error);
                    console.error(`[LiveViewer] WGSL code:`, wgslCode);
                }
            }

            initializeComputeNodes(computeNodes) {
                try {
                    this.computeNodes = computeNodes;
                    this.computePipelines.clear();
                    this.computeOutputs.clear();

                    // Initialize each compute node
                    for (const nodeData of computeNodes) {
                        this.initializeComputeNode(nodeData);
                    }

                    console.log(`[LiveViewer] Initialized ${computeNodes.length} compute nodes`);
                    console.log('[LiveViewer] Compute output keys:', Array.from(this.computeOutputs.keys()));
                } catch (error) {
                    console.error('[LiveViewer] Error initializing compute nodes:', error);
                }
            }

            initializeComputeNode(nodeData) {
                const { nodeId, wgslCode, resolution, inputs } = nodeData;

                try {
                    // Log node info including inputs
                    console.log(`[LiveViewer] Initializing compute node ${nodeId} with inputs:`, inputs);

                    // Create shader module
                    const shaderModule = this.device.createShaderModule({
                        code: wgslCode,
                        label: `compute-${nodeId}`
                    });

                    // Create output texture
                    const width = resolution[0];
                    const height = resolution[1];

                    const outputTexture = this.device.createTexture({
                        size: [width, height, 1],
                        format: 'rgba8unorm',
                        usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC
                    });

                    // Create uniform buffer for compute parameters
                    const uniformBuffer = this.device.createBuffer({
                        size: 256, // Large enough for parameters
                        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                    });

                    // Create sampler for input textures
                    const sampler = this.device.createSampler({
                        magFilter: 'linear',
                        minFilter: 'linear',
                        addressModeU: 'repeat',
                        addressModeV: 'repeat'
                    });

                    // Store output texture
                    this.computeOutputs.set(nodeId, {
                        texture: outputTexture,
                        sampler: sampler,
                        uniformBuffer: uniformBuffer,
                        width: width,
                        height: height
                    });

                    // Create compute pipeline (will be done on first dispatch)
                    this.computePipelines.set(nodeId, {
                        shaderModule: shaderModule,
                        outputTexture: outputTexture,
                        uniformBuffer: uniformBuffer,
                        sampler: sampler,
                        nodeData: nodeData
                    });

                    console.log(`[LiveViewer] Initialized compute node ${nodeId} (${width}x${height})`);
                } catch (error) {
                    console.error(`[LiveViewer] Error initializing compute node ${nodeId}:`, error);
                }
            }

            executeFragmentNodes(time) {
                if (this.fragmentNodes.length === 0) {
                    return;
                }

                try {
                    const encoder = this.device.createCommandEncoder({ label: 'fragment-encoder' });

                    // Execute each fragment node in order
                    for (const nodeData of this.fragmentNodes) {
                        this.executeFragmentNode(encoder, nodeData, time);
                    }

                    this.device.queue.submit([encoder.finish()]);
                } catch (error) {
                    console.error('[LiveViewer] Error executing fragment nodes:', error);
                }
            }

            executeFragmentNode(encoder, nodeData, time) {
                const { nodeId } = nodeData;
                const pipelineData = this.fragmentPipelines.get(nodeId);
                const outputData = this.fragmentOutputs.get(nodeId);

                if (!pipelineData || !outputData) {
                    return;
                }

                try {
                    const { pipeline, bindGroups, uniformBuffers } = pipelineData;
                    const { texture, width, height } = outputData;

                    // Update uniform buffers before rendering
                    this.updateFragmentUniforms(uniformBuffers, time, width, height, nodeData);

                    // Begin render pass
                    const pass = encoder.beginRenderPass({
                        colorAttachments: [{
                            view: texture.createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear',
                            storeOp: 'store'
                        }]
                    });

                    pass.setPipeline(pipeline);

                    // Bind all bind groups
                    for (let i = 0; i < bindGroups.length; i++) {
                        pass.setBindGroup(i, bindGroups[i]);
                    }

                    // Draw fullscreen triangle
                    pass.draw(3, 1, 0, 0);
                    pass.end();

                } catch (error) {
                    console.error(`[LiveViewer] Error executing fragment node ${nodeId}:`, error);
                }
            }

            updateFragmentUniforms(uniformBuffers, time, width, height, nodeData) {
                // Update aspect uniform (u)
                const aspectBuffer = uniformBuffers.get('u');
                if (aspectBuffer) {
                    const aspectData = new Float32Array([width / height, 0, 0, 0]);
                    this.device.queue.writeBuffer(aspectBuffer, 0, aspectData);
                }

                // Update globals uniform (g)
                const globalsBuffer = uniformBuffers.get('g');
                if (globalsBuffer) {
                    const globalsData = new Float32Array([
                        width,
                        height,
                        time,
                        0, // audioEnvelope
                        0, // audioEnvelopeBass
                        0, // audioEnvelopeMids
                        0, // audioEnvelopeHighs
                        0  // audioEnvelopeFull
                    ]);
                    this.device.queue.writeBuffer(globalsBuffer, 0, globalsData);
                }

                // Update parameter uniforms (u_params)
                const paramsBuffer = uniformBuffers.get('u_params');
                if (paramsBuffer && nodeData.parameterValues && nodeData.parameterValues.length > 0) {
                    const data = new Float32Array(nodeData.parameterValues);
                    this.device.queue.writeBuffer(paramsBuffer, 0, data);
                }
            }

            executeComputeNodes(time) {
                if (this.computeNodes.length === 0) {
                    return;
                }

                try {
                    const encoder = this.device.createCommandEncoder({ label: 'compute-encoder' });

                    // Execute each compute node in order
                    for (const nodeData of this.computeNodes) {
                        this.executeComputeNode(encoder, nodeData, time);
                    }

                    this.device.queue.submit([encoder.finish()]);
                } catch (error) {
                    console.error('[LiveViewer] Error executing compute nodes:', error);
                }
            }

            executeComputeNode(encoder, nodeData, time) {
                const { nodeId, resolution, params } = nodeData;
                const pipelineData = this.computePipelines.get(nodeId);

                if (!pipelineData) {
                    return;
                }

                // Extract live parameter values from uniformValuesArray for this node
                const liveParams = this._extractNodeParams(nodeId, params);

                // DEBUG: Log ComputeNoise params to verify extraction
                if (nodeData.kind === 'ComputeNoise' && this._computeNoiseDebugCount % 60 === 0) {
                    console.log('[DEBUG] ComputeNoise params:', {
                        nodeId,
                        defaultParams: params,
                        liveParams,
                        'liveParams.colorize': liveParams.colorize,
                        'typeof colorize': typeof liveParams.colorize,
                        'colorize truthy?': !!liveParams.colorize,
                        uniformKeys: this.uniformKeys,
                        uniformValuesArray: this.uniformValuesArray
                    });
                }
                this._computeNoiseDebugCount = (this._computeNoiseDebugCount || 0) + 1;

                try {
                    const { shaderModule, outputTexture, uniformBuffer, sampler } = pipelineData;

                    // Create/get compute pipeline
                    if (!pipelineData.pipeline) {
                        // Parse shader to determine bind group layout based on actual WGSL bindings
                        const bindGroupLayout = this.createComputeBindGroupLayout(nodeData);

                        const pipelineLayout = this.device.createPipelineLayout({
                            bindGroupLayouts: [bindGroupLayout]
                        });

                        pipelineData.pipeline = this.device.createComputePipeline({
                            layout: pipelineLayout,
                            compute: {
                                module: shaderModule,
                                entryPoint: 'main'
                            }
                        });

                        pipelineData.bindGroupLayout = bindGroupLayout;

                        // Determine validInputs from WGSL instead of node.inputs
                        const hasBinding2 = /@binding\(2\)/.test(nodeData.wgslCode);
                        const hasBinding4 = /@binding\(4\)/.test(nodeData.wgslCode);
                        const validInputs = hasBinding4 ? 2 : (hasBinding2 ? 1 : 0);
                        pipelineData.validInputs = validInputs;

                        console.log(`[LiveViewer] Created compute pipeline for node ${nodeId}, WGSL-detected inputs: ${validInputs}`);
                    }

                    // Update uniform buffer
                    const width = resolution[0];
                    const height = resolution[1];
                    const uniformData = new Float32Array(64);
                    uniformData[0] = width;
                    uniformData[1] = height;
                    uniformData[2] = time;

                    // Pack parameters in the correct order based on node kind
                    // Each compute node has a specific uniform struct layout
                    // Use liveParams (from uniformValuesArray) for real-time updates during drag
                    if (liveParams) {
                        // Common pattern: node-specific params start at index 3
                        // We need to match the WGSL uniform struct order exactly

                        if (nodeData.kind === 'ComputeNoise') {
                            // ComputeNoise uniforms: resolution(vec2), time, scale, octaves, speed, colorize, _padding
                            uniformData[3] = liveParams.scale !== undefined ? liveParams.scale : 8.0;
                            uniformData[4] = liveParams.octaves !== undefined ? liveParams.octaves : 5.0;
                            uniformData[5] = liveParams.speed !== undefined ? liveParams.speed : 0.1;
                            uniformData[6] = liveParams.colorize !== undefined ? (liveParams.colorize ? 1.0 : 0.0) : 1.0;
                            // padding at [7] (default zero)

                            // DEBUG: Log packed uniforms
                            if (this._computeNoiseDebugCount % 60 === 1) {
                                console.log('[DEBUG] ComputeNoise packed uniforms:', {
                                    resolution: [uniformData[0], uniformData[1]],
                                    time: uniformData[2],
                                    scale: uniformData[3],
                                    octaves: uniformData[4],
                                    speed: uniformData[5],
                                    colorize: uniformData[6]
                                });
                            }
                        } else if (nodeData.kind === 'ComputeMix') {
                            // ComputeMix uniforms: resolution(vec2), time, amount, opacity, padding(vec3)
                            // NOTE: 'mode' is baked into the shader at compile time, not in uniforms
                            uniformData[3] = liveParams.amount !== undefined ? liveParams.amount : 0.5;
                            uniformData[4] = liveParams.opacity !== undefined ? liveParams.opacity : 1.0;
                            // padding at [5-7] (default zeros)
                        } else {
                            // Generic fallback: copy all numeric params in order they appear
                            let paramIndex = 3;
                            for (const key in liveParams) {
                                const value = liveParams[key];
                                if (typeof value === 'number') {
                                    uniformData[paramIndex++] = value;
                                } else if (typeof value === 'boolean') {
                                    uniformData[paramIndex++] = value ? 1.0 : 0.0;
                                }
                            }
                        }
                    }

                    this.device.queue.writeBuffer(uniformBuffer, 0, uniformData);

                    // Create bind group entries
                    const bindGroupEntries = [
                        { binding: 0, resource: { buffer: uniformBuffer } },
                        { binding: 1, resource: outputTexture.createView() }
                    ];

                    // Use the stored validInputs count to ensure consistency with the layout
                    const validInputs = pipelineData.validInputs || 0;
                    // console.log(`[LiveViewer] Creating bind group for node ${nodeId}, inputs: ${JSON.stringify(nodeData.inputs)}, validInputs: ${validInputs} (from pipeline data)`);

                    // Helper function to get input texture/sampler or create fallback
                    const getInputResources = (inputIndex) => {
                        if (!nodeData.inputs || inputIndex >= nodeData.inputs.length) {
                            // WGSL has bindings but node.inputs is empty/short
                            // Create black fallback texture
                            console.log(`[LiveViewer] Node ${nodeId}: WGSL expects input ${inputIndex} but node.inputs is empty/short`);
                            const fallbackTexture = this.device.createTexture({
                                size: [resolution[0], resolution[1], 1],
                                format: 'rgba8unorm',
                                usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
                            });
                            const black = new Uint8Array(resolution[0] * resolution[1] * 4).fill(0);
                            this.device.queue.writeTexture(
                                { texture: fallbackTexture },
                                black,
                                { bytesPerRow: resolution[0] * 4 },
                                [resolution[0], resolution[1]]
                            );
                            return {
                                texture: fallbackTexture.createView(),
                                sampler: null,
                                isValid: false
                            };
                        }

                        const inputNodeId = nodeData.inputs[inputIndex];
                        if (inputNodeId === null || inputNodeId === undefined) {
                            // Input slot exists but is null/undefined
                            console.log(`[LiveViewer] Node ${nodeId}: input ${inputIndex} is null/undefined`);
                            const fallbackTexture = this.device.createTexture({
                                size: [resolution[0], resolution[1], 1],
                                format: 'rgba8unorm',
                                usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
                            });
                            const black = new Uint8Array(resolution[0] * resolution[1] * 4).fill(0);
                            this.device.queue.writeTexture(
                                { texture: fallbackTexture },
                                black,
                                { bytesPerRow: resolution[0] * 4 },
                                [resolution[0], resolution[1]]
                            );
                            return {
                                texture: fallbackTexture.createView(),
                                sampler: null,
                                isValid: false
                            };
                        }

                        // Try to get from compute outputs first
                        const computeOutput = this.computeOutputs.get(inputNodeId);
                        if (computeOutput && computeOutput.texture && computeOutput.sampler) {
                            console.log(`[LiveViewer] ✓ Node ${nodeId} input ${inputIndex} from compute node ${inputNodeId}`);
                            return {
                                texture: computeOutput.texture.createView(),
                                sampler: computeOutput.sampler,
                                isValid: true
                            };
                        }

                        // Try to get from fragment outputs
                        const fragmentOutput = this.fragmentOutputs.get(inputNodeId);
                        if (fragmentOutput && fragmentOutput.texture && fragmentOutput.sampler) {
                            console.log(`[LiveViewer] ✓ Node ${nodeId} input ${inputIndex} from fragment node ${inputNodeId}`);
                            return {
                                texture: fragmentOutput.texture.createView(),
                                sampler: fragmentOutput.sampler,
                                isValid: true
                            };
                        }

                        console.error(`[LiveViewer] ❌ Node ${nodeId} input ${inputIndex} from node ${inputNodeId} not available`);
                        // Create black fallback texture
                        const fallbackTexture = this.device.createTexture({
                            size: [resolution[0], resolution[1], 1],
                            format: 'rgba8unorm',
                            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
                        });
                        const black = new Uint8Array(resolution[0] * resolution[1] * 4).fill(0);
                        this.device.queue.writeTexture(
                            { texture: fallbackTexture },
                            black,
                            { bytesPerRow: resolution[0] * 4 },
                            [resolution[0], resolution[1]]
                        );
                        return {
                            texture: fallbackTexture.createView(),
                            sampler: null, // Will use shared sampler
                            isValid: false
                        };
                    };

                    // Add input bindings based on validInputs count
                    if (validInputs > 0) {
                        // Get first input (binding 2)
                        const input0 = getInputResources(0);

                        // Special handling for ComputeMix: if input A is missing (fragment node),
                        // use input B for both A and B to avoid darkening
                        let actualInput0 = input0;
                        if (nodeData.kind === 'ComputeMix' && validInputs === 2 && input0 && !input0.isValid) {
                            const input1 = getInputResources(1);
                            if (input1 && input1.isValid) {
                                console.log(`[LiveViewer] ComputeMix: Input A is fragment (missing), using input B for both inputs to avoid darkening`);
                                actualInput0 = input1;
                            }
                        }

                        if (actualInput0) {
                            bindGroupEntries.push({
                                binding: 2,
                                resource: actualInput0.texture
                            });

                            // binding 3: shared sampler (use from actualInput0 or create fallback)
                            const sharedSampler = actualInput0.sampler || this.device.createSampler({
                                magFilter: 'linear',
                                minFilter: 'linear'
                            });
                            bindGroupEntries.push({
                                binding: 3,
                                resource: sharedSampler
                            });

                            // console.log(`[LiveViewer] Added input A (bindings 2 & 3), entries now: ${bindGroupEntries.length}`);
                        }

                        // Get second input if node has 2 inputs (binding 4)
                        if (validInputs >= 2) {
                            const input1 = getInputResources(1);
                            if (input1) {
                                bindGroupEntries.push({
                                    binding: 4,
                                    resource: input1.texture
                                });
                                // console.log(`[LiveViewer] Added input B (binding 4), entries now: ${bindGroupEntries.length}`);
                            }
                        }
                    } else {
                        // console.log(`[LiveViewer] Node ${nodeId} has no inputs, skipping input bindings`);
                    }

                    // console.log(`[LiveViewer] Bind group for node ${nodeId} has ${bindGroupEntries.length} entries`);

                    // Create bind group
                    const bindGroup = this.device.createBindGroup({
                        layout: pipelineData.bindGroupLayout,
                        entries: bindGroupEntries
                    });

                    // Dispatch compute shader
                    const pass = encoder.beginComputePass({ label: `compute-${nodeId}` });
                    pass.setPipeline(pipelineData.pipeline);
                    pass.setBindGroup(0, bindGroup);

                    const workgroupSizeX = 8;
                    const workgroupSizeY = 8;
                    const dispatchX = Math.ceil(width / workgroupSizeX);
                    const dispatchY = Math.ceil(height / workgroupSizeY);

                    pass.dispatchWorkgroups(dispatchX, dispatchY, 1);
                    pass.end();

                } catch (error) {
                    console.error(`[LiveViewer] Error executing compute node ${nodeId}:`, error);
                    console.error(`[LiveViewer] Stack trace:`, error.stack);
                    console.error(`[LiveViewer] Node data:`, nodeData);
                }
            }

            createComputeBindGroupLayout(nodeData) {
                const entries = [
                    {
                        binding: 0,
                        visibility: GPUShaderStage.COMPUTE,
                        buffer: { type: 'uniform' }
                    },
                    {
                        binding: 1,
                        visibility: GPUShaderStage.COMPUTE,
                        storageTexture: { access: 'write-only', format: 'rgba8unorm' }
                    }
                ];

                // CRITICAL: Parse WGSL to detect actual input bindings in the shader
                // Don't rely on node.inputs array as it might not match the compiled shader
                const hasBinding2 = /@binding\(2\)/.test(nodeData.wgslCode);
                const hasBinding3 = /@binding\(3\)/.test(nodeData.wgslCode);
                const hasBinding4 = /@binding\(4\)/.test(nodeData.wgslCode);

                if (hasBinding2) {
                    // console.log(`[LiveViewer] Node ${nodeData.nodeId}: WGSL has @binding(2), adding to layout`);

                    // binding 2: input texture A
                    entries.push({
                        binding: 2,
                        visibility: GPUShaderStage.COMPUTE,
                        texture: { sampleType: 'float' }
                    });

                    if (hasBinding3) {
                        // binding 3: shared sampler
                        entries.push({
                            binding: 3,
                            visibility: GPUShaderStage.COMPUTE,
                            sampler: { type: 'filtering' }
                        });
                    }

                    if (hasBinding4) {
                        // binding 4: input texture B (for nodes with 2 inputs like ComputeMix)
                        entries.push({
                            binding: 4,
                            visibility: GPUShaderStage.COMPUTE,
                            texture: { sampleType: 'float' }
                        });
                    }
                } else {
                    // console.log(`[LiveViewer] Node ${nodeData.nodeId}: WGSL has no input bindings`);
                }

                // console.log(`[LiveViewer] Bind group layout for node ${nodeData.nodeId} has ${entries.length} entries`);
                return this.device.createBindGroupLayout({ entries });
            }

            // Extract live parameter values for a specific node from uniformValuesArray
            _extractNodeParams(nodeId, defaultParams) {
                const params = {};

                // Copy default values first
                if (defaultParams) {
                    Object.assign(params, defaultParams);
                }

                // If we have uniformKeys mapping, extract live values
                if (this.uniformKeys && this.uniformKeys.length > 0 && this.uniformValuesArray.length > 0) {
                    for (let i = 0; i < this.uniformKeys.length; i++) {
                        const key = this.uniformKeys[i]; // Format: "nodeId.paramName"
                        const [keyNodeId, paramName] = key.split('.');

                        // If this key belongs to our node, extract the value
                        if (keyNodeId === String(nodeId)) {
                            const value = this.uniformValuesArray[i];
                            if (value !== undefined) {
                                params[paramName] = value;
                            }
                        }
                    }
                }

                return params;
            }

            // Fragment node helper methods
            analyzeFragmentBindings(wgsl) {
                const groups = {};
                const re = /@group\((\d+)\)\s*@binding\((\d+)\)\s*var(?:<(\w+)>)?\s+([\w_]+)\s*:\s*([^;]+);/g;

                let match;
                while ((match = re.exec(wgsl)) !== null) {
                    const groupIndex = parseInt(match[1], 10);
                    const bindingIndex = parseInt(match[2], 10);
                    const varName = match[4];
                    const typeStr = match[5].trim();

                    let kind = 'uniform-buffer';
                    if (/^sampler/.test(typeStr)) kind = 'sampler';
                    else if (/^texture_2d/.test(typeStr)) kind = 'texture-2d';
                    else if (/^texture_cube/.test(typeStr)) kind = 'texture-cube';

                    if (!groups[groupIndex]) groups[groupIndex] = {};
                    groups[groupIndex][bindingIndex] = { kind, varName, typeStr };
                }

                return { groups };
            }

            createFragmentBindResources(bindingMap, parameterValues) {
                const groupIndices = Object.keys(bindingMap.groups).map(Number).sort((a, b) => a - b);

                const layouts = [];
                const bindGroups = [];
                const uniformBuffers = new Map();

                for (const groupIndex of groupIndices) {
                    const bindings = bindingMap.groups[groupIndex];
                    const entries = [];
                    const resources = [];

                    for (const bindingKey of Object.keys(bindings)) {
                        const binding = parseInt(bindingKey, 10);
                        const meta = bindings[binding];

                        // Create layout entry
                        const layoutEntry = this.createFragmentLayoutEntry(meta.kind, binding);
                        entries.push(layoutEntry);

                        // Create resource
                        const resource = this.createFragmentResource(meta, uniformBuffers, parameterValues);
                        resources.push({ binding, resource });
                    }

                    // Create layout
                    const layout = this.device.createBindGroupLayout({ entries });
                    layouts.push(layout);

                    // Create bind group
                    const bindGroup = this.device.createBindGroup({
                        layout,
                        entries: resources
                    });
                    bindGroups.push(bindGroup);
                }

                return { layouts, bindGroups, uniformBuffers };
            }

            createFragmentLayoutEntry(kind, binding) {
                const stages = GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX;

                switch (kind) {
                    case 'uniform-buffer':
                        return { binding, visibility: stages, buffer: { type: 'uniform' } };
                    case 'sampler':
                        return { binding, visibility: stages, sampler: {} };
                    case 'texture-2d':
                        return { binding, visibility: stages, texture: {} };
                    case 'texture-cube':
                        return { binding, visibility: stages, texture: { viewDimension: 'cube' } };
                    default:
                        return { binding, visibility: stages, buffer: { type: 'uniform' } };
                }
            }

            createFragmentResource(meta, uniformBuffers, parameterValues) {
                switch (meta.kind) {
                    case 'uniform-buffer': {
                        let size = 64; // Default size

                        if (meta.varName === 'u') {
                            // Aspect ratio
                            size = 16;
                        } else if (meta.varName === 'g') {
                            // Globals (resolution, time, audio)
                            size = 32;
                        } else if (meta.varName === 'u_params') {
                            // Parameters - use provided size if available
                            if (parameterValues && parameterValues.length > 0) {
                                size = Math.max(16, Math.ceil(parameterValues.length * 4 / 16) * 16);
                            }
                        }

                        const buffer = this.device.createBuffer({
                            size,
                            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                            label: `uniform-${meta.varName}`
                        });
                        uniformBuffers.set(meta.varName, buffer);

                        // Initialize parameter buffer if we have values
                        if (meta.varName === 'u_params' && parameterValues && parameterValues.length > 0) {
                            const data = new Float32Array(parameterValues);
                            this.device.queue.writeBuffer(buffer, 0, data);
                        }

                        return { buffer };
                    }
                    case 'sampler': {
                        // Create default sampler
                        const sampler = this.device.createSampler({
                            magFilter: 'linear',
                            minFilter: 'linear'
                        });
                        return sampler;
                    }
                    case 'texture-2d':
                    case 'texture-cube': {
                        // Create dummy 1x1 white texture as fallback
                        const texture = this.device.createTexture({
                            size: [1, 1, 1],
                            format: 'rgba8unorm',
                            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
                        });
                        const color = new Uint8Array([255, 255, 255, 255]);
                        this.device.queue.writeTexture({ texture }, color, { bytesPerRow: 4 }, [1, 1]);
                        return texture.createView();
                    }
                    default:
                        throw new Error(`Unknown resource kind: ${meta.kind}`);
                }
            }

            compileShader(wgslCode) {
                try {
                    this.currentShader = wgslCode;

                    // Clear existing pipeline
                    this.pipeline = null;
                    this.bindGroups = [];
                    this.resources = {};

                    // Parse shader bindings
                    const bindings = this.analyzeBindings(wgslCode);

                    // Create shader module
                    const shaderModule = this.device.createShaderModule({
                        code: wgslCode
                    });

                    // Create bind group layouts and resources
                    const bindGroupLayouts = this.createBindGroupLayouts(bindings);

                    // Create pipeline
                    const pipelineLayout = this.device.createPipelineLayout({
                        bindGroupLayouts
                    });

                    this.pipeline = this.device.createRenderPipeline({
                        layout: pipelineLayout,
                        vertex: {
                            module: shaderModule,
                            entryPoint: 'vs_main'
                        },
                        fragment: {
                            module: shaderModule,
                            entryPoint: 'fs_main',
                            targets: [{ format: this.format }]
                        },
                        primitive: {
                            topology: 'triangle-list'
                        }
                    });

                    // Create bind groups
                    this.createBindGroups(bindings, bindGroupLayouts);

                    this.setStatus('Rendering', 'connected');

                } catch (error) {
                    console.error('[LiveViewer] ❌ Shader compilation error:', error);
                    console.error('[LiveViewer] Error stack:', error.stack);
                    this.setStatus('Shader compilation failed: ' + error.message, 'error');

                    // Show error in info
                    document.getElementById('info').innerHTML =
                        `<strong>Shader Error:</strong><br>${error.message}`;
                }
            }

            analyzeBindings(wgsl) {
                const groups = {};
                const re = /@group\((\d+)\)\s*@binding\((\d+)\)\s*var(?:<(\w+)>)?\s+([\w_]+)\s*:\s*([^;]+);/g;

                let match;
                while ((match = re.exec(wgsl)) !== null) {
                    const groupIndex = parseInt(match[1], 10);
                    const bindingIndex = parseInt(match[2], 10);
                    const addressSpace = (match[3] || '').trim();
                    const varName = match[4];
                    const typeStr = match[5].trim();

                    let kind = 'uniform-buffer';
                    if (/^sampler/.test(typeStr)) kind = 'sampler';
                    else if (/^texture_2d/.test(typeStr)) kind = 'texture-2d';
                    else if (/^texture_cube/.test(typeStr)) kind = 'texture-cube';
                    else if (/storage/.test(addressSpace)) kind = 'storage-buffer';

                    if (!groups[groupIndex]) groups[groupIndex] = {};
                    groups[groupIndex][bindingIndex] = { kind, varName, typeStr };
                }

                return { groups };
            }

            createBindGroupLayouts(bindings) {
                const layouts = [];
                const { groups } = bindings;

                for (const groupIndex in groups) {
                    const entries = [];
                    const groupBindings = groups[groupIndex];

                    for (const bindingIndex in groupBindings) {
                        const { kind } = groupBindings[bindingIndex];
                        const entry = this.createLayoutEntry(parseInt(bindingIndex), kind);
                        entries.push(entry);
                    }

                    const layout = this.device.createBindGroupLayout({ entries });
                    layouts.push(layout);
                }

                return layouts;
            }

            createLayoutEntry(binding, kind) {
                const STAGES = GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX;

                switch (kind) {
                    case 'uniform-buffer':
                        return { binding, visibility: STAGES, buffer: { type: 'uniform' } };
                    case 'storage-buffer':
                        return { binding, visibility: STAGES, buffer: { type: 'read-only-storage' } };
                    case 'sampler':
                        return { binding, visibility: STAGES, sampler: {} };
                    case 'texture-2d':
                        return { binding, visibility: STAGES, texture: {} };
                    case 'texture-cube':
                        return { binding, visibility: STAGES, texture: { viewDimension: 'cube' } };
                    default:
                        return { binding, visibility: STAGES, buffer: { type: 'uniform' } };
                }
            }

            createBindGroups(bindings, layouts) {
                const { groups } = bindings;

                // Store bindings and layouts for recreation
                this.currentBindings = bindings;
                this.currentLayouts = layouts;

                for (const groupIndex in groups) {
                    const groupBindings = groups[groupIndex];
                    const entries = [];

                    for (const bindingIndex in groupBindings) {
                        const { kind, varName, typeStr } = groupBindings[bindingIndex];
                        const resourceWrapper = this.createResource(kind, varName);

                        if (resourceWrapper) {
                            // Unwrap resource for WebGPU bind group API
                            // Buffers stay wrapped: { buffer: GPUBuffer }
                            // Samplers and textures must be unwrapped: GPUSampler, GPUTextureView
                            let resource;
                            let isValid = false;

                            if (kind === 'uniform-buffer' || kind === 'storage-buffer') {
                                // Buffer resources stay as { buffer: GPUBuffer }
                                isValid = resourceWrapper.buffer !== undefined;
                                resource = resourceWrapper; // Keep wrapped
                                if (!isValid) {
                                    console.error(`[LiveViewer] Invalid buffer resource for ${varName}:`, resourceWrapper);
                                }
                            } else if (kind === 'sampler') {
                                // Sampler resources must be unwrapped
                                isValid = resourceWrapper.sampler !== undefined;
                                resource = resourceWrapper.sampler; // Unwrap!
                                if (!isValid) {
                                    console.error(`[LiveViewer] Invalid sampler resource for ${varName}:`, resourceWrapper);
                                }
                            } else if (kind.includes('texture')) {
                                // Texture resources must be unwrapped
                                isValid = resourceWrapper.textureView !== undefined;
                                resource = resourceWrapper.textureView; // Unwrap!
                                if (!isValid) {
                                    console.error(`[LiveViewer] Invalid texture resource for ${varName}:`, resourceWrapper);
                                }
                            }

                            if (isValid) {
                                entries.push({
                                    binding: parseInt(bindingIndex),
                                    resource
                                });
                            } else {
                                console.error(`[LiveViewer] Skipping invalid binding ${bindingIndex} (${kind}/${varName}/${typeStr})`);
                            }
                        } else {
                            console.warn(`[LiveViewer] No resource created for binding ${bindingIndex} (${kind}/${varName}/${typeStr})`);
                        }
                    }

                    if (entries.length > 0) {
                        try {
                            const bindGroup = this.device.createBindGroup({
                                layout: layouts[groupIndex],
                                entries
                            });
                            this.bindGroups[groupIndex] = bindGroup;
                        } catch (error) {
                            console.error(`[LiveViewer] Error creating bind group ${groupIndex}:`, error);
                            console.error(`[LiveViewer] Failed entries:`, JSON.stringify(entries.map(e => ({
                                binding: e.binding,
                                hasBuffer: !!e.resource?.buffer,
                                hasSampler: !!e.resource?.sampler,
                                hasTextureView: !!e.resource?.textureView,
                                resource: e.resource
                            })), null, 2));
                            throw error;
                        }
                    }
                }
            }

            recreateBindGroups() {
                // Recreate bind groups to capture fresh compute output textures
                if (!this.currentBindings || !this.currentLayouts) {
                    return;
                }

                this.createBindGroups(this.currentBindings, this.currentLayouts);
            }

            createResource(kind, varName) {
                if (kind === 'uniform-buffer') {
                    // Create uniform buffer
                    let size = 64;
                    if (varName === 'u') {
                        size = 16; // aspect only
                    } else if (varName === 'g') {
                        size = 48; // globals (resolution, time, audio)
                    } else if (varName === 'p' || varName === 'u_params') {
                        // Parameters buffer - allocate large enough for many parameters
                        // WebGPU requires 16-byte alignment, so sizes are multiples of 16
                        size = 256; // Enough for 64 float parameters (256 / 4 = 64 floats)
                    } else {
                        // Default size for unknown buffers
                        size = 256;
                    }

                    const buffer = this.device.createBuffer({
                        size,
                        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                    });

                    this.resources[varName] = buffer;
                    return { buffer };

                } else if (kind === 'sampler') {
                    // Check if this is a compute node sampler
                    // Variable names are like: sampler_compute_node_27
                    // We need to extract just the node ID (27)
                    let nodeId = varName;

                    // Remove common sampler prefixes
                    nodeId = nodeId.replace(/^sampler_/, '');
                    nodeId = nodeId.replace(/^samplerCube_/, '');

                    // If it's a compute node sampler, extract the ID
                    if (nodeId.startsWith('compute_node_')) {
                        nodeId = nodeId.replace(/^compute_node_/, '');
                    }
                    // If it's a fragment node sampler, extract the ID
                    if (nodeId.startsWith('fragment_node_')) {
                        nodeId = nodeId.replace(/^fragment_node_/, '');
                    }

                    // Try to find matching compute output by exact ID match first
                    let computeOutput = this.computeOutputs.get(nodeId);

                    // If not found, try with "node_" prefix (registry keys might have this prefix)
                    if (!computeOutput) {
                        computeOutput = this.computeOutputs.get('node_' + nodeId);
                        // if (computeOutput) {
                        //     console.log(`[LiveViewer] Matched sampler ${varName} with node_ prefix: node_${nodeId}`);
                        // }
                    }
 
                    // If still not found, try partial matching
                    if (!computeOutput) {
                        for (const [key, value] of this.computeOutputs) {
                            // Try matching with the stripped nodeId or with node_ prefix
                            if (nodeId === key ||
                                `node_${nodeId}` === key ||
                                varName.includes(key) ||
                                key.includes(nodeId)) {
                                computeOutput = value;
                                // console.log(`[LiveViewer] Matched sampler ${varName} (nodeId: ${nodeId}) -> ${key}`);
                                break;
                            }
                        }
                    }

                    if (computeOutput && computeOutput.sampler) {
                        // console.log(`[LiveViewer] Using compute sampler for ${varName} (nodeId: ${nodeId})`);
                        return { sampler: computeOutput.sampler };
                    }

                    // Try to find matching fragment output by exact ID match first
                    let fragmentOutput = this.fragmentOutputs.get(nodeId);

                    // If not found, try with "node_" prefix (registry keys might have this prefix)
                    if (!fragmentOutput) {
                        fragmentOutput = this.fragmentOutputs.get('node_' + nodeId);
                    }

                    // If still not found, try partial matching
                    if (!fragmentOutput) {
                        for (const [key, value] of this.fragmentOutputs) {
                            // Try matching with the stripped nodeId or with node_ prefix
                            if (nodeId === key ||
                                `node_${nodeId}` === key ||
                                varName.includes(key) ||
                                key.includes(nodeId)) {
                                fragmentOutput = value;
                                break;
                            }
                        }
                    }

                    if (fragmentOutput && fragmentOutput.sampler) {
                        // console.log(`[LiveViewer] Using fragment sampler for ${varName} (nodeId: ${nodeId})`);
                        return { sampler: fragmentOutput.sampler };
                    }

                    // Default sampler
                    // console.log(`[LiveViewer] Creating default sampler for ${varName} (no compute/fragment output found)`);
                    const sampler = this.device.createSampler({
                        magFilter: 'linear',
                        minFilter: 'linear'
                    });
                    return { sampler };

                } else if (kind === 'texture-2d' || kind === 'texture-cube') {
                    // Check if this is a compute node output texture
                    // Variable names are like: compute_node_27 (NOT texture_compute_node_27)
                    // We need to extract just the node ID (27)
                    let nodeId = varName;

                    // Remove common texture prefixes (though they usually don't exist for compute nodes)
                    nodeId = nodeId.replace(/^texture_/, '');
                    nodeId = nodeId.replace(/^textureCube_/, '');

                    // If it's a compute node texture, extract the ID
                    if (nodeId.startsWith('compute_node_')) {
                        nodeId = nodeId.replace(/^compute_node_/, '');
                    }
                    // If it's a fragment node texture, extract the ID
                    if (nodeId.startsWith('fragment_node_')) {
                        nodeId = nodeId.replace(/^fragment_node_/, '');
                    }

                    // Try to find matching compute output by exact ID match first
                    let computeOutput = this.computeOutputs.get(nodeId);

                    // If not found, try with "node_" prefix (registry keys might have this prefix)
                    if (!computeOutput) {
                        computeOutput = this.computeOutputs.get('node_' + nodeId);
                        // if (computeOutput) {
                        //     console.log(`[LiveViewer] Matched texture ${varName} with node_ prefix: node_${nodeId}`);
                        // }
                    }

                    // If still not found, try partial matching
                    if (!computeOutput) {
                        for (const [key, value] of this.computeOutputs) {
                            // Try matching with the stripped nodeId or with node_ prefix
                            if (nodeId === key ||
                                `node_${nodeId}` === key ||
                                varName.includes(key) ||
                                key.includes(nodeId)) {
                                computeOutput = value;
                                // console.log(`[LiveViewer] Matched texture ${varName} (nodeId: ${nodeId}) -> ${key}`);
                                break;
                            }
                        }
                    }

                    if (computeOutput && computeOutput.texture) {
                        // console.log(`[LiveViewer] Using compute output texture for ${varName} (nodeId: ${nodeId})`);
                        return { textureView: computeOutput.texture.createView() };
                    }

                    // Try to find matching fragment output by exact ID match first
                    let fragmentOutput = this.fragmentOutputs.get(nodeId);

                    // If not found, try with "node_" prefix (registry keys might have this prefix)
                    if (!fragmentOutput) {
                        fragmentOutput = this.fragmentOutputs.get('node_' + nodeId);
                    }

                    // If still not found, try partial matching
                    if (!fragmentOutput) {
                        for (const [key, value] of this.fragmentOutputs) {
                            // Try matching with the stripped nodeId or with node_ prefix
                            if (nodeId === key ||
                                `node_${nodeId}` === key ||
                                varName.includes(key) ||
                                key.includes(nodeId)) {
                                fragmentOutput = value;
                                break;
                            }
                        }
                    }

                    if (fragmentOutput && fragmentOutput.texture) {
                        // console.log(`[LiveViewer] Using fragment output texture for ${varName} (nodeId: ${nodeId})`);
                        return { textureView: fragmentOutput.texture.createView() };
                    }

                    // Create dummy texture as fallback
                    // console.log(`[LiveViewer] Creating dummy texture for ${varName} (nodeId: ${nodeId}, no compute/fragment output found)`);
                    // console.log(`[LiveViewer] Available compute outputs:`, Array.from(this.computeOutputs.keys()));
                    // console.log(`[LiveViewer] Available fragment outputs:`, Array.from(this.fragmentOutputs.keys()));
                    const texture = this.device.createTexture({
                        size: [1, 1, 1],
                        format: 'rgba8unorm',
                        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
                    });
                    const color = new Uint8Array([255, 255, 255, 255]);
                    this.device.queue.writeTexture({ texture }, color, { bytesPerRow: 4 }, [1, 1]);
                    return { textureView: texture.createView() };
                }

                return null;
            }

            startRendering() {
                if (this.isRunning) return;

                this.isRunning = true;
                this.startTime = performance.now();
                this.frameCount = 0;
                this.lastFPSUpdate = this.startTime;

                this.renderLoop();
            }

            stopRendering() {
                this.isRunning = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }

            renderLoop() {
                if (!this.isRunning) return;

                this.render();
                this.animationId = requestAnimationFrame(() => this.renderLoop());
            }

            render() {
                if (!this.pipeline || !this.device) {
                    if (this.frameCount === 0) {
                        console.warn('[LiveViewer] Cannot render: pipeline or device not ready');
                    }
                    return;
                }

                try {
                    // Get current time
                    const time = this.syncedTime !== null ? this.syncedTime : (performance.now() - this.startTime) / 1000;

                    // Execute fragment nodes FIRST (their outputs feed into compute nodes)
                    if (this.fragmentNodes.length > 0) {
                        this.executeFragmentNodes(time);

                        // CRITICAL: Recreate bind groups after fragment execution
                        // to capture the fresh fragment output textures for compute nodes and final shader
                        // ONLY recreate if not done recently to avoid destroyed texture errors
                        const now = performance.now();
                        if (!this._lastBindGroupRecreate || (now - this._lastBindGroupRecreate) > 100) {
                            this.recreateBindGroups();
                            this._lastBindGroupRecreate = now;
