<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rhizomium Documentation - WebGPU node editor for real-time generative visuals</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Rhizomium, a browser-based WebGPU node editor for real-time generative visuals. Build shaders by connecting 133 nodes, animate parameters with expressions, and drive them from audio, MIDI or a keyframe timeline.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#d67f4f">
  <meta name="author" content="Rhizomium">
  <link rel="canonical" href="https://studio.tenderworld.org/docs">
  <!-- Icons live in public/, which Vite copies to the site root verbatim, so
       these paths survive a build. /favicon.ico is the one every browser
       requests without being asked and the one Google puts beside a result. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icon.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Social / link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rhizomium Documentation">
  <meta property="og:title" content="Rhizomium Documentation - WebGPU node editor for real-time generative visuals">
  <meta property="og:description" content="Build GPU shaders by connecting nodes in the browser. Guides, a 133-node reference, parameter expressions, audio reactivity, MIDI and timeline animation.">
  <meta property="og:url" content="https://studio.tenderworld.org/docs">
  <meta property="og:image" content="https://studio.tenderworld.org/docs/images/editor-overview.webp">
  <meta property="og:image:alt" content="The Rhizomium node editor, showing the menu bar, node canvas and live preview">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rhizomium Documentation">
  <meta name="twitter:description" content="Build GPU shaders by connecting nodes in the browser - guides, node reference and expression syntax.">
  <meta name="twitter:image" content="https://studio.tenderworld.org/docs/images/editor-overview.webp">

  <!-- Structured data. Docsify renders client-side, so this is the most
       reliable machine-readable description of the site for crawlers. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "name": "Rhizomium",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web browser with WebGPU (Chrome 113+, Edge 113+)",
        "url": "https://studio.tenderworld.org/",
        "description": "A modular GPU node environment for real-time generative visuals, built on WebGPU and WGSL. Compose shaders visually by connecting nodes.",
        "featureList": [
          "133 nodes across 12 categories",
          "Real-time WebGPU preview",
          "Parameter expressions with time, audio and mouse variables",
          "Keyframe timeline animation",
          "MIDI controller mapping",
          "Audio-reactive parameters",
          "GPU compute nodes and 3D field visualization"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      },
      {
        "@type": "TechArticle",
        "name": "Rhizomium Documentation",
        "headline": "Rhizomium Documentation",
        "description": "Guides and reference for building real-time generative visuals with the Rhizomium WebGPU node editor.",
        "url": "https://studio.tenderworld.org/docs",
        "inLanguage": "en",
        "about": { "@type": "Thing", "name": "WebGPU shader node editor" }
      }
    ]
  }
  </script>

  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #d67f4f;
      --theme-color-dark: #c87550;
      --theme-color-light: #e89968;
      --sidebar-width: 280px;
    }

    .sidebar {
      background-color: #1a1a1a;
    }

    /* Section headers in sidebar */
    .sidebar-nav > ul > li > p {
      margin-top: 16px;
      margin-bottom: 8px;
      padding: 8px 12px;
      background: linear-gradient(90deg, rgba(214, 127, 79, 0.15) 0%, rgba(214, 127, 79, 0.05) 100%);
      border-left: 3px solid var(--theme-color);
      font-weight: 600;
      font-size: 0.95em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--theme-color-light);
    }

    /* First section no top margin */
    .sidebar-nav > ul > li:first-child > p {
      margin-top: 8px;
    }

    /* Separator lines between major sections */
    .sidebar-nav > ul > li > hr {
      border: none;
      border-top: 1px solid rgba(214, 127, 79, 0.2);
      margin: 16px 0;
    }

    .sidebar-nav li strong {
      font-size: 1.1em;
      color: var(--theme-color);
    }

    /* Active link highlighting */
    .sidebar-nav li.active > a {
      color: var(--theme-color-light);
      font-weight: 600;
      border-right: 2px solid var(--theme-color);
    }

    /* Hover effects */
    .sidebar-nav a:hover {
      color: var(--theme-color-light);
    }

    .app-name-link {
      font-size: 1.4em !important;
      font-weight: 600;
    }

    .markdown-section h1 {
      color: var(--theme-color);
    }

    .markdown-section h2 {
      color: var(--theme-color-light);
      border-bottom: 1px solid rgba(214, 127, 79, 0.3);
    }

    /* Links in content */
    .markdown-section a {
      color: var(--theme-color-light);
    }

    .markdown-section a:hover {
      color: var(--theme-color);
      text-decoration: underline;
    }

    .markdown-section code {
      background-color: #2d2d2d;
      color: #f8f8f2;
      border-radius: 4px;
      padding: 2px 6px;
    }

    .markdown-section pre > code {
      background-color: #2d2d2d;
      color: #f8f8f2;
    }
  </style>
</head>
<body>
  <!--
    Docsify renders into #app, replacing whatever is here the moment it boots.
    Everything between the two markers below is generated at build time by
    scripts/docs-meta.mjs (from _sidebar.md, the same source as llms.txt and
    sitemap.xml) and written into dist/docs/index.html, so a crawler or reader
    without JavaScript gets the real documentation index instead of a spinner.
    In the repository the markers wrap the plain placeholder; do not hand-edit
    the generated version, edit the generator.
  -->
  <div id="app"><!--docs-fallback-->Loading Rhizomium Documentation...<!--/docs-fallback--></div>

  <script>
    window.$docsify = {
      name: 'Rhizomium',
      repo: 'https://github.com/Amirashkan/rhizomium',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,

      // Pin the markdown root to an absolute path. The site is deployed with
      // `trailingSlash: false`, so this page is served at `/docs` (no slash)
      // and relative fetches would resolve against the site root instead —
      // every page would 404. With basePath both /docs and /docs/ work.
      basePath: '/docs/',

      // Homepage
      homepage: 'README.md',

      // Search plugin
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 6,
        hideOtherSidebarContent: false,
      },

      // Pagination
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },

      // Copy code plugin
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },

      // Theme color
      themeColor: '#d67f4f',

      // Alias for cleaner URLs
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-glsl.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
