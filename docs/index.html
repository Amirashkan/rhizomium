<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rhizomium Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Rhizomium - A modular GPU node environment for real-time generative visuals">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #a25430;
      --theme-color-dark: #824326;
      --sidebar-width: 280px;
    }

    .sidebar {
      background-color: #1a1a1a;
    }

    .sidebar-nav li strong {
      font-size: 1.1em;
      color: var(--theme-color);
    }

    .app-name-link {
      font-size: 1.4em !important;
      font-weight: 600;
    }

    .markdown-section h1 {
      color: var(--theme-color);
    }

    .markdown-section code {
      background-color: #2d2d2d;
      color: #f8f8f2;
      border-radius: 4px;
      padding: 2px 6px;
    }

    .markdown-section pre > code {
      background-color: #2d2d2d;
      color: #f8f8f2;
    }
  </style>
</head>
<body>
  <div id="app">Loading Rhizomium Documentation...</div>

  <script>
    window.$docsify = {
      name: 'Rhizomium',
      repo: 'https://github.com/Amirashkan/glsl-node-editor',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,

      // Homepage
      homepage: 'README.md',

      // Search plugin
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 6,
        hideOtherSidebarContent: false,
      },

      // Pagination
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },

      // Copy code plugin
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },

      // Theme color
      themeColor: '#a25430',

      // Alias for cleaner URLs
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-glsl.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
