<!doctype html>
<html lang="En">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The editor opens `.rz` patches written on other people's machines, so it
      treats patch contents as untrusted. Expression parameters are evaluated by
      the AST interpreter in utils/UnifiedExpressionSystem.js rather than eval();
      omitting 'unsafe-eval' here makes that a rule the platform enforces, so a
      future eval() shortcut fails loudly instead of silently reopening the hole.
      'unsafe-inline' is still required by the inline bootstrap script below.

      connect-src carries the Tauri IPC endpoints (`ipc:` on macOS/Linux,
      `http://ipc.localhost` on Windows/Android) because invoke() reaches the
      Rust side with fetch(). A <meta> policy is enforced *on top of* the header
      Tauri injects from tauri.conf.json — the browser takes the intersection,
      and the stricter one wins — so leaving them out here blocks IPC no matter
      what the config says, and Tauri silently degrades to the slower
      postMessage bridge. Keep this list in sync with the `csp` field in
      src-tauri/tauri.conf.json.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https://art.tenderworld.org https://studio.tenderworld.org ws://localhost:8765 http://localhost:8765 ws://127.0.0.1:8766 ws://localhost:8767 ws://127.0.0.1:8767 ws://localhost:8768 ws://127.0.0.1:8768; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>GLSL Node Editor</title>
    <!-- tokens.css declares the design variables every other stylesheet reads,
         so it has to come first. -->
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../src/styles/menu.css" />
    <link rel="stylesheet" href="../src/styles/texture.css" />
    <link rel="stylesheet" href="../src/styles/timeline.css" />
    <link rel="stylesheet" href="../src/styles/ai-panel.css" />
    <link rel="stylesheet" href="../src/styles/review-panel.css" />
    <link rel="stylesheet" href="../src/styles/mapping-panel.css" />
    <link rel="stylesheet" href="../src/styles/screens-panel.css" />
    <link rel="stylesheet" href="../src/styles/web-viewer-tool.css" />
    <link rel="stylesheet" href="../src/styles/shader-compiler.css" />
    <link rel="stylesheet" href="../src/vj/vj-control-panel.css" />
    <style>
      /* Undo/Redo — ordinary dropdown rows, so they inherit .menu-dropdown
         button and only need their disabled state spelled out. */
      #btn-undo:disabled,
      #btn-redo:disabled {
        color: var(--rz-text-disabled);
        cursor: not-allowed;
      }

      .icon {
        font-size: 14px;
        font-weight: bold;
      }

      /* History section styling */
      .history-section {
        display: inline-block;
        margin: 0 8px;
        padding: 0 8px;
        border-left: 1px solid var(--rz-line);
        border-right: 1px solid var(--rz-line);
      }

      .history-section label {
        font-size: 11px;
        color: var(--rz-text-3);
        margin-right: 4px;
      }
    </style>
    <style>
      /* Device Warning Overlay */
      #device-warning-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Soft aurora over the app ground, matching the welcome stage. */
        background:
          radial-gradient(
            50% 60% at 22% 20%,
            rgba(167, 139, 250, 0.22),
            transparent 55%
          ),
          radial-gradient(
            50% 60% at 82% 78%,
            rgba(207, 100, 153, 0.18),
            transparent 55%
          ),
          var(--rz-bg-deep);
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: var(--rz-font-ui);
        color: var(--rz-text);
      }

      #device-warning-overlay.show {
        display: flex;
      }

      .warning-container {
        max-width: 600px;
        padding: 40px;
        background: rgba(22, 18, 15, 0.92);
        border-radius: var(--rz-r-modal);
        box-shadow: var(--rz-shadow-modal);
        border: 1px solid var(--rz-line-strong);
        text-align: center;
      }

      .warning-icon {
        margin-bottom: 20px;
        color: var(--rz-warn);
      }

      .warning-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--rz-text);
      }

      .warning-message {
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 24px;
        color: var(--rz-text-2);
      }

      .warning-details {
        background: var(--rz-well);
        border: 1px solid var(--rz-line);
        padding: 16px;
        border-radius: var(--rz-r-row);
        margin-bottom: 24px;
        text-align: left;
        font-size: 13px;
        color: var(--rz-text-2);
      }

      .warning-details strong {
        color: var(--rz-text-3);
        font-weight: 500;
      }

      .warning-solutions {
        text-align: left;
        margin-bottom: 24px;
      }

      .warning-solutions h3 {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        margin-bottom: 12px;
        color: var(--rz-text-faint);
      }

      .warning-solutions ul {
        list-style: none;
        padding: 0;
        margin: 0;
        color: var(--rz-text-2);
        font-size: 13px;
      }

      .warning-solutions li {
        padding: 8px 0;
        padding-left: 24px;
        position: relative;
      }

      .warning-solutions li:before {
        content: "→";
        position: absolute;
        left: 0;
        color: var(--rz-accent);
      }

      .warning-button {
        background: var(--rz-accent);
        color: var(--rz-accent-ink);
        border: none;
        padding: 12px 24px;
        font-family: var(--rz-font-ui);
        font-size: 14px;
        font-weight: 600;
        border-radius: var(--rz-r-field);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .warning-button:hover {
        background: var(--rz-accent-hover);
        box-shadow: var(--rz-accent-glow);
      }

      .warning-button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <!-- Device Warning Overlay -->
    <div id="device-warning-overlay">
      <div class="warning-container">
        <div class="warning-icon"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-status-warning"/></svg></div>
        <div class="warning-title" id="warning-title">Device Not Supported</div>
        <div class="warning-message" id="warning-message">
          This application requires a desktop browser with WebGPU support.
        </div>
        <div class="warning-details" id="warning-details"></div>
        <div class="warning-solutions" id="warning-solutions"></div>
        <button class="warning-button" id="warning-dismiss">
          I Understand
        </button>
      </div>
    </div>

    <!-- Top Menu Bar - Rhizomium Menu -->
    <div id="top-menu-bar">
      <!-- File Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-file">File <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-file">
          <button id="btn-new-project">New Project</button>
          <button id="btn-open-project">Open Project…</button>
          <button id="btn-save">Save</button>
          <button id="btn-save-as">Save As…</button>
          <div class="menu-separator"></div>
          <button id="btn-file-manager">File Manager</button>
          <div class="menu-separator"></div>
          <button id="btn-export">Export</button>
          
          <!-- Publish Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Publish <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <div class="submenu-section">
                <div class="submenu-section-title">Share to TenderWorld Gallery</div>
                <span class="submenu-note">Uploads at the render resolution set in View → Preview / Export Settings.</span>
                <button id="btn-publish-image" class="submenu-button submenu-button-primary">Publish Image…</button>
                <button id="btn-publish-animation" class="submenu-button">Publish Animation…</button>
              </div>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <!-- The web viewer: this patch, playing on its own page, the way a
               gallery visitor sees it. A Cloude entitlement (viewer.web).
               The desktop app cannot open a second tab, so main.js disables
               this rather than removing it — a missing menu item reads as a
               missing feature. -->
          <button id="btn-web-viewer">Open in Web Viewer</button>
          <!-- The page that link leads to: how it looks, which parameters it
               hands a visitor, and the link itself. Part of the published
               document, so it is available wherever a patch is authored,
               desktop included. -->
          <button id="btn-web-viewer-tool">Web Viewer Tool…</button>

          <div class="menu-separator"></div>
          <button id="btn-backups">Backups</button>
          <div class="menu-separator"></div>
          <button id="btn-exit">Exit</button>
        </div>
      </div>

      <!-- Edit Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-edit">Edit <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-edit">
          <!-- Titles carry the description only; src/ui/shortcuts.js appends the
               key combo, so the shortcut is stated in exactly one place. -->
          <button id="btn-undo" title="Undo last action" disabled>
            <svg class="rz-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-undo"/></svg> Undo
          </button>
          <button id="btn-redo" title="Redo last action" disabled>
            <svg class="rz-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-redo"/></svg> Redo
          </button>
          <div class="menu-separator"></div>
          <button id="btn-cut">Cut</button>
          <button id="btn-copy">Copy</button>
          <button id="btn-paste">Paste</button>
          <button id="btn-delete">Delete</button>
          <div class="menu-separator"></div>
          <button id="btn-rebuild">Rebuild</button>
          <div class="menu-separator"></div>
          <button id="btn-preferences">Preferences…</button>
        </div>
      </div>

      <!-- View Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-view">View <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-view">
          <!-- Panels Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Panels <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <button id="btn-toggle-param-panel" class="submenu-button">Toggle ParamPanel</button>
              <button id="btn-toggle-preview-panel" class="submenu-button">Toggle Preview Panel</button>
              <button id="btn-toggle-3d-viewport" class="submenu-button">Toggle 3D Viewport</button>
            </div>
          </div>
          
          <!-- Zoom Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Zoom <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <button id="btn-zoom-in" class="submenu-button">Zoom In</button>
              <button id="btn-zoom-out" class="submenu-button">Zoom Out</button>
              <button id="btn-zoom-reset" class="submenu-button">Reset Zoom</button>
            </div>
          </div>
          
          <!-- Grid Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Grid <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <!-- The row carries the id the keymap prints its shortcut on
                   (src/ui/shortcuts.js); the shortcut fires the checkbox. -->
              <label class="submenu-toggle" id="row-view-show-grid">
                <input type="checkbox" id="view-show-grid" />
                Show Grid
              </label>
              <label class="submenu-toggle" id="row-snap-toggle">
                <input type="checkbox" id="snap-toggle" />
                Snap to Grid
              </label>
              <label class="snap-size">
                <span>Grid Size:</span>
                <input type="number" id="snap-size" inputmode="numeric" min="2" max="512" step="1" value="20" />
              </label>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-preview-export-settings">Preview / Export Settings</button>
          <div class="menu-separator"></div>
          <button id="btn-toggle-console">Console</button>
          <button id="btn-toggle-timeline">Timeline</button>
          <button id="btn-toggle-vj">VJ Control</button>
          <!-- Starts hidden, and showing it switches on per-frame GPU timing
               (see main.js, where the render loop syncs the profiler's enabled
               flag to this panel's visibility). Without this entry Ctrl+Alt+P
               was the only way to reach it at all. -->
          <button id="btn-toggle-profiler" title="Compute profiler overlay — costs performance while open">Compute Profiler</button>
          <!-- Second-monitor full-screen viewer. Hidden by default; revealed
               only in the Vite/desktop build (see main.js / isViteBuild.js). -->
          <div class="menu-separator" id="sep-second-monitor" style="display:none"></div>
          <!-- The rig's master switch: turns on every screen laid out in the
               screens panel below. main.js rewrites the label with the count. -->
          <button id="btn-second-monitor" style="display:none">Open Output</button>
          <!-- Multi-screen output: lay a patch out across several displays, each
               framed on its own part of the composition. Revealed alongside the
               output button, in the Vite/desktop build only. -->
          <button id="btn-output-screens" style="display:none">Output Screens…</button>
          <!-- The second viewer always RENDERS the output format, so its sims and
               framing match the editor exactly. This only sets how many pixels it
               presents with; the render is letterboxed into that surface.
               Revealed with the button. -->
          <label class="snap-size" id="row-second-monitor-display" style="display:none">
            <span>Viewer Display:</span>
            <select id="second-monitor-display">
              <option value="0">Auto (display)</option>
              <option value="1280">720p</option>
              <option value="1920">1080p</option>
              <option value="2560">1440p</option>
              <option value="3840">4K</option>
              <option value="custom">Custom…</option>
            </select>
          </label>
          <!-- Custom presentation long edge in device pixels. -->
          <label class="snap-size" id="row-second-monitor-display-custom" style="display:none">
            <span>Long edge:</span>
            <input type="number" id="second-monitor-display-custom" inputmode="numeric" min="256" max="7680" step="1" value="1920" />
          </label>
          <!-- NDI output. Publishes the render to the network as an NDI source.
               Like the second monitor this needs the Vite/desktop build, and it
               also needs the local bridge (ndi_bridge_server.py) that owns the
               NDI sender, so it ships hidden and main.js reveals it. -->
          <div class="menu-separator" id="sep-ndi-output" style="display:none"></div>
          <button id="btn-ndi-output" style="display:none">NDI Output</button>
          <!-- The name receivers list this machine under. Two machines both
               announcing "Rhizomium" is a confusing show. Revealed with the
               button. -->
          <label class="snap-size" id="row-ndi-source-name" style="display:none">
            <span>NDI Name:</span>
            <input type="text" id="ndi-source-name" maxlength="64" value="Rhizomium" />
          </label>
        </div>
      </div>

      <!-- Node Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-node">Node <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-node">
          <button id="btn-create-node">Create Node…</button>
          <button id="btn-delete-node">Delete Node</button>
          <button id="btn-duplicate-node">Duplicate Node</button>
          <div class="menu-separator"></div>
          
          <!-- Pins Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Pins <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <button id="btn-connect-pins" class="submenu-button">Connect Pins</button>
              <button id="btn-disconnect-pins" class="submenu-button">Disconnect Pins</button>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-node-settings">Node Settings / Params…</button>
        </div>
      </div>

      <!-- Tools Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-tools">Tools <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-tools">
          <button id="btn-account">Account…</button>
          <button id="btn-ai-panel">AI Assistant</button>
          <button id="btn-review-panel">Patch Review</button>
          <button id="btn-collab">Collab Space…</button>
          <div class="menu-separator"></div>
          <button id="btn-script-editor">Script Editor / Python Console</button>
          <div class="menu-separator"></div>
          
          <!-- Shader Tools Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Shader Tools <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <button id="btn-shader-compiler" class="submenu-button">Shader Compiler</button>
              <button id="btn-glsl-utilities" class="submenu-button">GLSL Utilities</button>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-mapping-tool">Projection Mapping…</button>
          <div class="menu-separator"></div>
          <button id="btn-audio-settings">Audio…</button>
          <button id="btn-midi-settings">MIDI Settings</button>
          <button id="btn-osc-settings">OSC Receiver</button>
        </div>
      </div>

      <!-- Window Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-window">Window <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-window">
          <!-- Layouts Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Layouts <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
            <div class="menu-submenu">
              <button id="btn-layout-default" class="submenu-button">Default</button>
              <button id="btn-layout-custom" class="submenu-button">Custom</button>
              <button id="btn-layout-minimal" class="submenu-button">Minimal</button>
              <div class="menu-separator"></div>
              <!-- What "Custom" means. Without this row the Custom layout
                   could be applied but never written, so it would only ever
                   be whatever the workspace happened to look like the first
                   time the row was clicked. -->
              <button id="btn-layout-save-custom" class="submenu-button">Save Current as Custom</button>
            </div>
          </div>
          
          <button id="btn-floating-windows">Floating Windows</button>
          <div class="menu-separator"></div>
          <button id="btn-reset-layout">Reset Layout</button>
        </div>
      </div>

      <!-- Help Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-help">Help <svg class="rz-icon menu-caret" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-down"/></svg></button>
        <div class="menu-dropdown" id="dropdown-help">
          <button id="btn-documentation">Documentation</button>
          <button id="btn-shortcuts">Shortcuts / Keymap</button>
          <div class="menu-separator"></div>
          <button id="btn-welcome">Welcome</button>
          <div class="menu-separator"></div>
          <button id="btn-about">About</button>
        </div>
      </div>

      <span id="status" class="menu-status">Idle</span>
    </div>

    <canvas id="gpu-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>

    <!-- Hidden file input for file loading -->
    <input
      id="file-import"
      type="file"
      accept=".json,.rz,.wgsl,.glsl"
      style="display: none"
    />
    <div id="param-panel" class="panel hidden"></div>
    <div id="ctx-menu" class="menu hidden"></div>
    <!-- Floating WGSL Toggle Button -->
    <button id="btn-toggle-wgsl-console" class="floating-toggle-btn" aria-label="Toggle WGSL Console" title="Show Generated WGSL">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </button>

    <div id="code-console" class="closed">
      <div class="code-toolbar">
        <span class="code-title">Generated WGSL</span>
        <div class="code-actions">
          <button id="btn-select-code">Select All</button>
          <button id="btn-copy-code">Copy</button>
          <button id="btn-export-wgsl">Export WGSL</button>
          <button id="btn-close-console" aria-label="Hide console">Close</button>
        </div>
      </div>
      <pre id="code" tabindex="0"></pre>
    </div>

    <!-- Device Detection Script. An external module rather than an inline
         block: the webview's CSP does not allow inline script. Module scripts
         run in document order, so this still starts before main.js below, and
         main.js still waits on the window flags it sets. -->
    <script type="module" src="../src/ui/deviceCheckBoot.js"></script>

    <script type="module" src="../main.js"></script>
    <div id="err-overlay" class="hidden">
      <div class="err-title">Shader Error</div>
      <pre id="err-log"></pre>
    </div>
  </body>
</html>
