<!doctype html>
<html lang="En">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GLSL Node Editor</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="src/styles/texture.css" />
    <link rel="stylesheet" href="src/styles/timeline.css" />
    <link rel="stylesheet" href="src/vj/vj-control-panel.css" />
    <style>
      /* Undo/Redo button styling */
      #btn-undo, #btn-redo {
        background: var(--bg-secondary, #2a2a2a);
        border: 1px solid var(--border-color, #444);
        color: var(--text-color, #ffffff);
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin: 0 2px;
      }

      #btn-undo:hover:not(:disabled), 
      #btn-redo:hover:not(:disabled) {
        background: var(--bg-hover, #3a3a3a);
        border-color: var(--accent-color, #0078d4);
      }

      #btn-undo:disabled, 
      #btn-redo:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .icon {
        font-size: 14px;
        font-weight: bold;
      }

      /* History section styling */
      .history-section {
        display: inline-block;
        margin: 0 8px;
        padding: 0 8px;
        border-left: 1px solid #444;
        border-right: 1px solid #444;
      }

      .history-section label {
        font-size: 11px;
        color: #aaa;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <!-- Top Menu Bar - Rhizomium Menu -->
    <div id="top-menu-bar">
      <!-- File Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-file">File ▾</button>
        <div class="menu-dropdown" id="dropdown-file">
          <button id="btn-new-project">New Project</button>
          <button id="btn-open-project">Open Project…</button>
          <button id="btn-save">Save</button>
          <button id="btn-save-as">Save As…</button>
          <div class="menu-separator"></div>
          <button id="btn-export">Export</button>
          
          <!-- Publish Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Publish ▸</button>
            <div class="menu-submenu">
              <div class="submenu-section">
                <div class="submenu-section-title">To Cloud / Server</div>
                <label for="publish-target" class="menu-label">Select Target:</label>
                <select id="publish-target">
                  <option value="tenderworld">TenderWorld</option>
                  <option value="custom">Custom Server…</option>
                </select>
                <label class="submenu-toggle">
                  <input type="checkbox" id="publish-include-previews" />
                  Include Node Previews
                </label>
              </div>
              <div class="submenu-section">
                <div class="submenu-section-title">Version / Commit</div>
                <label for="publish-commit-message" class="menu-label">Commit Message:</label>
                <input type="text" id="publish-commit-message" placeholder="Enter version message..." class="submenu-input" />
                <button id="btn-publish" class="submenu-button submenu-button-primary">Publish</button>
              </div>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-backups">Backups</button>
          <div class="menu-separator"></div>
          <button id="btn-exit">Exit</button>
        </div>
      </div>

      <!-- Edit Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-edit">Edit ▾</button>
        <div class="menu-dropdown" id="dropdown-edit">
          <button id="btn-undo" title="Undo last action (Ctrl+Z)" disabled>
            <span class="icon">&#8634;</span> Undo
          </button>
          <button id="btn-redo" title="Redo last action (Ctrl+Y)" disabled>
            <span class="icon">&#8635;</span> Redo
          </button>
          <div class="menu-separator"></div>
          <button id="btn-cut">Cut</button>
          <button id="btn-copy">Copy</button>
          <button id="btn-paste">Paste</button>
          <button id="btn-delete">Delete</button>
          <div class="menu-separator"></div>
          <button id="btn-rebuild">Rebuild</button>
          <div class="menu-separator"></div>
          <button id="btn-preferences">Preferences…</button>
        </div>
      </div>

      <!-- View Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-view">View ▾</button>
        <div class="menu-dropdown" id="dropdown-view">
          <!-- Panels Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Panels ▸</button>
            <div class="menu-submenu">
              <button id="btn-toggle-param-panel" class="submenu-button">Toggle ParamPanel</button>
              <button id="btn-toggle-preview-panel" class="submenu-button">Toggle Preview Panel</button>
            </div>
          </div>
          
          <!-- Zoom Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Zoom ▸</button>
            <div class="menu-submenu">
              <button id="btn-zoom-in" class="submenu-button">Zoom In</button>
              <button id="btn-zoom-out" class="submenu-button">Zoom Out</button>
              <button id="btn-zoom-reset" class="submenu-button">Reset Zoom</button>
            </div>
          </div>
          
          <!-- Grid Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Grid ▸</button>
            <div class="menu-submenu">
              <label class="submenu-toggle">
                <input type="checkbox" id="view-show-grid" />
                Show Grid
              </label>
              <label class="submenu-toggle">
                <input type="checkbox" id="snap-toggle" />
                Snap to Grid
              </label>
              <label class="snap-size">
                <span>Grid Size:</span>
                <input type="number" id="snap-size" inputmode="numeric" min="2" max="512" step="1" value="20" />
              </label>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-preview-export-settings">Preview / Export Settings</button>
          <div class="menu-separator"></div>
          <button id="btn-toggle-console">Console</button>
          <button id="btn-toggle-timeline">Timeline</button>
          <button id="btn-toggle-vj">VJ Control</button>
        </div>
      </div>

      <!-- Node Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-node">Node ▾</button>
        <div class="menu-dropdown" id="dropdown-node">
          <button id="btn-create-node">Create Node…</button>
          <button id="btn-delete-node">Delete Node</button>
          <button id="btn-duplicate-node">Duplicate Node</button>
          <div class="menu-separator"></div>
          
          <!-- Pins Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Pins ▸</button>
            <div class="menu-submenu">
              <button id="btn-connect-pins" class="submenu-button">Connect Pins</button>
              <button id="btn-disconnect-pins" class="submenu-button">Disconnect Pins</button>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-node-settings">Node Settings / Params…</button>
        </div>
      </div>

      <!-- Tools Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-tools">Tools ▾</button>
        <div class="menu-dropdown" id="dropdown-tools">
          <button id="btn-script-editor">Script Editor / Python Console</button>
          <div class="menu-separator"></div>
          
          <!-- Shader Tools Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Shader Tools ▸</button>
            <div class="menu-submenu">
              <button id="btn-shader-compiler" class="submenu-button">Shader Compiler</button>
              <button id="btn-glsl-utilities" class="submenu-button">GLSL Utilities</button>
            </div>
          </div>
          
          <div class="menu-separator"></div>
          <button id="btn-audio-settings">Audio Settings</button>
          <button id="btn-midi-settings">MIDI Settings</button>
        </div>
      </div>

      <!-- Window Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-window">Window ▾</button>
        <div class="menu-dropdown" id="dropdown-window">
          <!-- Layouts Submenu -->
          <div class="menu-item-with-submenu">
            <button class="menu-submenu-trigger">Layouts ▸</button>
            <div class="menu-submenu">
              <button id="btn-layout-default" class="submenu-button">Default</button>
              <button id="btn-layout-custom" class="submenu-button">Custom</button>
              <button id="btn-layout-minimal" class="submenu-button">Minimal</button>
            </div>
          </div>
          
          <button id="btn-floating-windows">Floating Windows</button>
          <div class="menu-separator"></div>
          <button id="btn-reset-layout">Reset Layout</button>
        </div>
      </div>

      <!-- Help Menu -->
      <div class="menu-section">
        <button class="menu-button" id="menu-help">Help ▾</button>
        <div class="menu-dropdown" id="dropdown-help">
          <button id="btn-documentation">Documentation</button>
          <button id="btn-shortcuts">Shortcuts / Keymap</button>
          <div class="menu-separator"></div>
          <button id="btn-welcome">Welcome</button>
          <div class="menu-separator"></div>
          <button id="btn-about">About</button>
        </div>
      </div>

      <span id="status" class="menu-status">Idle</span>
    </div>

    <canvas id="gpu-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>

    <!-- Hidden file input for file loading -->
    <input
      id="file-import"
      type="file"
      accept=".json,.rz,.wgsl,.glsl"
      style="display: none"
    />
    <div id="param-panel" class="panel hidden"></div>
    <div id="ctx-menu" class="menu hidden"></div>
    <!-- Floating WGSL Toggle Button -->
    <button id="btn-toggle-wgsl-console" class="floating-toggle-btn" aria-label="Toggle WGSL Console" title="Show Generated WGSL">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </button>

    <div id="code-console" class="closed">
      <div class="code-toolbar">
        <span class="code-title">Generated WGSL</span>
        <div class="code-actions">
          <button id="btn-select-code">Select All</button>
          <button id="btn-copy-code">Copy</button>
          <button id="btn-export-wgsl">Export WGSL</button>
          <button id="btn-close-console" aria-label="Hide console">Close</button>
        </div>
      </div>
      <pre id="code" tabindex="0"></pre>
    </div>

    <script type="module" src="../main.js?v=43c7367"></script>
    <div id="err-overlay" class="hidden">
      <div class="err-title">Shader Error</div>
      <pre id="err-log"></pre>
    </div>
  </body>
</html>
