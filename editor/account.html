<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      Desktop sign-in window.
      =======================
      The desktop app signs in by pairing: it gets a short code from the
      gallery, the artist approves that code on the gallery's /desktop page,
      and the app collects a token (src/ai/desktopPairing.js).

      This used to happen in a webview window pointed straight at the gallery,
      and it could not finish there. That window had none of the browser's
      sessions, the magic link the gallery emails opened in the default browser
      instead, and signing in landed on /gallery with no address bar to find
      the way back to the code.

      So the app owns this window, and the gallery opens in the artist's own
      browser, where all of that already works. The window shows the code,
      hands it to the clipboard, and closes itself once the approval comes
      through. src/ui/accountWindow.js drives it; the editor opens it from
      src/ui/accountSession.js and re-reads the account when it closes.
    -->
    <title>Sign in to Rhizomium</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <style>
      /* Palette lifted from landing.css, as splash.html does. */
      :root {
        --bg: #0e0c0a;
        --surface: #17130f;
        --fg: #ece5db;
        --fg-soft: rgba(236, 229, 219, 0.66);
        --fg-faint: rgba(236, 229, 219, 0.4);
        --line: rgba(236, 229, 219, 0.12);
        --rust: #a3532e;
        --rust-hi: #c47a4a;
        --ok: #8fbf7a;
        --bad: #d9785f;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --ui: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--ui);
      }

      main {
        max-width: 460px;
        margin: 0 auto;
        padding: 32px 28px 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
      }

      .brand img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      ol {
        margin: 0 0 22px;
        padding-left: 20px;
        color: var(--fg-soft);
        font-size: 13px;
        line-height: 1.6;
      }

      .code-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        margin-bottom: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
      }

      .code {
        font-family: var(--mono);
        font-size: 26px;
        letter-spacing: 0.18em;
        user-select: all;
        -webkit-user-select: all;
      }

      .code[data-empty] {
        color: var(--fg-faint);
      }

      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        padding: 8px 14px;
        font-size: 12px;
        letter-spacing: 0.06em;
      }

      button:hover:not(:disabled) {
        border-color: var(--fg-faint);
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button.primary {
        width: 100%;
        padding: 14px 18px;
        background: var(--rust);
        border-color: var(--rust);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      button.primary:hover:not(:disabled) {
        background: var(--rust-hi);
        border-color: var(--rust-hi);
      }

      .link {
        margin: 10px 0 0;
        color: var(--fg-faint);
        font-size: 12px;
      }

      .link code {
        font-family: var(--mono);
        color: var(--fg-soft);
        user-select: all;
        -webkit-user-select: all;
      }

      .status {
        min-height: 40px;
        margin: 20px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--fg-soft);
      }

      .status[data-tone="ok"] { color: var(--ok); }
      .status[data-tone="bad"] { color: var(--bad); }

      .foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="../assets/logo.png" alt="" />
        <h1>Sign in to Rhizomium</h1>
      </div>

      <ol>
        <li>Open the gallery in your browser. Sign in there if it asks.</li>
        <li>Paste the code below on the page and approve it.</li>
        <li>This window finishes the sign-in on its own.</li>
      </ol>

      <div class="code-box">
        <span class="code" id="account-code" data-empty>····-····</span>
        <button type="button" id="account-copy" disabled>Copy</button>
      </div>

      <button type="button" class="primary" id="account-open" disabled>
        Copy code &amp; open the gallery
      </button>
      <p class="link">
        Or go to <code id="account-url">art.tenderworld.org/desktop</code> yourself.
      </p>

      <p class="status" id="account-status" role="status" aria-live="polite">Starting sign-in…</p>

      <div class="foot">
        <button type="button" id="account-retry" hidden>Get a new code</button>
        <button type="button" id="account-cancel">Cancel</button>
      </div>
    </main>

    <script type="module" src="../src/ui/accountWindow.js"></script>
  </body>
</html>
