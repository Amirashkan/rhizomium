<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rhizomium — Output</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { cursor: none; }
    /* Two stacked outputs: the native WebGPU canvas (primary) and the 2D
       fallback that paints mirrored pixels. The receiver toggles which is shown. */
    #second-monitor-gpu,
    #second-monitor-output {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh; background: #000;
    }
    #second-monitor-gpu { display: none; }
    #second-monitor-hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      font: 13px system-ui, -apple-system, sans-serif; color: rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.45); padding: 6px 12px; border-radius: 6px;
      pointer-events: none; transition: opacity 0.5s ease; z-index: 2;
    }
    /* Performance profiler overlay (toggle with P). Hidden by default. */
    #second-monitor-profiler {
      position: fixed; top: 12px; left: 12px; margin: 0; display: none;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(120, 255, 170, 0.92); background: rgba(0, 0, 0, 0.55);
      padding: 8px 10px; border-radius: 6px; white-space: pre;
      pointer-events: none; z-index: 3;
    }
  </style>
</head>
<body>
  <canvas id="second-monitor-gpu"></canvas>
  <canvas id="second-monitor-output"></canvas>
  <div id="second-monitor-hint">Second-monitor output · Esc close · F fullscreen · P profiler · [ ] resolution</div>
  <pre id="second-monitor-profiler"></pre>
  <script type="module" src="../src/ui/secondMonitorReceiver.js"></script>
</body>
</html>
