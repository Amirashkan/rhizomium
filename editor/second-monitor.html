<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rhizomium — Output</title>
  <!-- The full-screen output surface the studio opens on a second display.
       There is nothing on it but the render, and it is useless without the
       studio window driving it, so keep it out of search results. -->
  <meta name="robots" content="noindex, follow" />
  <!-- Icons live in public/, which Vite copies to the site root verbatim, so
       these paths survive a build. This page goes fullscreen, but it opens in
       an ordinary tab first. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icon.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { cursor: none; }
    /* Two stacked outputs: the native WebGPU canvas (primary) and the 2D
       fallback that paints mirrored pixels. The receiver toggles which is shown. */
    #second-monitor-gpu,
    #second-monitor-output {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh; background: #000;
    }
    #second-monitor-gpu { display: none; }
    /* Projection-mapping presentation surface. When mapping is on, the render
       above is warped onto this instead of being shown directly, so it covers
       the WHOLE display: a surface may be pinned outside the composition's
       letterboxed rect. Hidden until a mapping arrives. */
    #second-monitor-map {
      position: fixed; inset: 0; display: none;
      width: 100vw; height: 100vh; background: #000; z-index: 2;
    }
    /* Performance profiler overlay (toggle with P). Hidden by default. */
    #second-monitor-profiler {
      position: fixed; top: 12px; left: 12px; margin: 0; display: none;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(120, 255, 170, 0.92); background: rgba(0, 0, 0, 0.55);
      padding: 8px 10px; border-radius: 6px; white-space: pre;
      pointer-events: none; z-index: 3;
    }
  </style>
</head>
<body>
  <canvas id="second-monitor-gpu"></canvas>
  <canvas id="second-monitor-output"></canvas>
  <canvas id="second-monitor-map"></canvas>
  <pre id="second-monitor-profiler"></pre>
  <script type="module" src="../src/ui/secondMonitorReceiver.js"></script>
</body>
</html>
