<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhizomium Viewer - Vercel Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #status {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            color: #ffa500;
        }

        #status.connected {
            color: #00ff00;
        }

        #status.error {
            color: #ff0000;
        }

        #info {
            font-size: 14px;
            color: #aaa;
            margin-top: 20px;
        }

        #controls {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #333;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat {
            font-size: 14px;
            color: #aaa;
        }

        .stat strong {
            color: #fff;
        }

        button {
            background: #444;
            border: 1px solid #666;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.primary {
            background: #007acc;
            border-color: #005a9e;
        }

        button.primary:hover {
            background: #005a9e;
        }

        .banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 20px;
            text-align: center;
            font-size: 13px;
        }

        .banner strong {
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="banner">
            <strong>🌿 Vercel Edition</strong> - Using BroadcastChannel (same-computer tabs only)
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="overlay">
                <div id="status" class="pulse">Waiting for stream...</div>
                <div id="info">
                    Open the <strong>Editor</strong> and click<br>
                    <strong>"Open External Viewer"</strong> to start streaming
                </div>
            </div>
        </div>

        <div id="controls">
            <div class="control-group">
                <div class="stat">Frames: <strong id="frame-count">0</strong></div>
                <div class="stat">FPS: <strong id="fps-value">0.0</strong></div>
                <div class="stat">Resolution: <strong id="resolution">-</strong></div>
            </div>
            <div class="control-group">
                <button id="btn-fullscreen">Fullscreen</button>
                <button id="btn-refresh">Refresh</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Check if BroadcastChannel is supported
        if (!('BroadcastChannel' in window)) {
            document.getElementById('status').textContent = 'BroadcastChannel not supported';
            document.getElementById('status').classList.add('error');
            document.getElementById('status').classList.remove('pulse');
            document.getElementById('info').innerHTML =
                'Your browser doesn\'t support BroadcastChannel API.<br>' +
                'Please use Chrome, Edge, Firefox, or Safari.';
            throw new Error('BroadcastChannel not supported');
        }

        class ViewerApp {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.channel = new BroadcastChannel('rhizo-frame-stream');

                // Statistics
                this.frameCount = 0;
                this.lastFrameTime = 0;
                this.fps = 0;
                this.fpsValues = [];
                this.hasReceivedFrame = false;

                // Bind events
                this.channel.onmessage = (event) => {
                    console.log('[Viewer] Received message:', event.data?.type || 'unknown');
                    this.handleMessage(event.data);
                };

                document.getElementById('btn-fullscreen').addEventListener('click', () => this.toggleFullscreen());
                document.getElementById('btn-refresh').addEventListener('click', () => location.reload());

                // Auto-resize canvas
                window.addEventListener('resize', () => this.resizeCanvas());

                console.log('[Viewer] Initialized and listening for frames...');
                console.log('[Viewer] BroadcastChannel name:', this.channel.name);

                // Request a frame
                this.requestFrame();

                // Send a test ping every 2 seconds to verify channel works
                setInterval(() => {
                    console.log('[Viewer] Sending keepalive ping...');
                    this.channel.postMessage({ type: 'viewer_ping', timestamp: Date.now() });
                }, 2000);
            }

            requestFrame() {
                this.channel.postMessage({
                    type: 'request_frame',
                    timestamp: Date.now()
                });
            }

            handleMessage(data) {
                const { type } = data;

                if (type === 'frame') {
                    this.handleFrame(data);
                } else if (type === 'stream_started') {
                    console.log('[Viewer] Stream started');
                    document.getElementById('status').textContent = 'Connected';
                    document.getElementById('status').classList.add('connected');
                    document.getElementById('status').classList.remove('pulse');
                } else if (type === 'stream_stopped') {
                    console.log('[Viewer] Stream stopped');
                    document.getElementById('status').textContent = 'Stream stopped';
                    document.getElementById('status').classList.remove('connected');
                }
            }

            handleFrame(data) {
                if (!this.hasReceivedFrame) {
                    this.hasReceivedFrame = true;
                    document.getElementById('overlay').classList.add('hidden');
                }

                const { imageData, metadata } = data;

                // Update canvas size if needed
                if (this.canvas.width !== metadata.width || this.canvas.height !== metadata.height) {
                    this.canvas.width = metadata.width;
                    this.canvas.height = metadata.height;
                    console.log(`[Viewer] Canvas resized to ${metadata.width}x${metadata.height}`);
                }

                // Draw frame
                this.ctx.putImageData(imageData, 0, 0);

                // Update stats
                this.frameCount++;
                document.getElementById('frame-count').textContent = this.frameCount;
                document.getElementById('resolution').textContent =
                    `${metadata.width}x${metadata.height}`;

                // Calculate FPS
                const now = performance.now();
                if (this.lastFrameTime > 0) {
                    const delta = (now - this.lastFrameTime) / 1000;
                    if (delta > 0) {
                        const instantFps = 1 / delta;
                        this.fpsValues.push(instantFps);
                        if (this.fpsValues.length > 30) {
                            this.fpsValues.shift();
                        }
                        const avgFps = this.fpsValues.reduce((a, b) => a + b, 0) / this.fpsValues.length;
                        this.fps = avgFps;
                        document.getElementById('fps-value').textContent = avgFps.toFixed(1);
                    }
                }
                this.lastFrameTime = now;
            }

            resizeCanvas() {
                // Canvas sizing is handled by CSS
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        }

        // Initialize viewer
        const viewer = new ViewerApp();

        console.log('🌿 Rhizomium Viewer (Vercel Edition) initialized');
        console.log('Waiting for frames from the editor...');
        console.log('Make sure the editor tab is open and streaming is active!');
    </script>
</body>
</html>
