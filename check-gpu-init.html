<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Initialization Checker</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #00ff88; }
        .check { margin: 10px 0; padding: 10px; background: rgba(0,255,0,0.1); border-left: 3px solid #00ff00; }
        .error { margin: 10px 0; padding: 10px; background: rgba(255,0,0,0.1); border-left: 3px solid #ff0000; color: #ff4444; }
        .warning { margin: 10px 0; padding: 10px; background: rgba(255,165,0,0.1); border-left: 3px solid #ffaa00; color: #ffaa00; }
        button {
            background: rgba(0,255,0,0.2);
            color: #00ff00;
            border: 1px solid rgba(0,255,0,0.5);
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            margin: 5px;
        }
        button:hover { background: rgba(0,255,0,0.3); }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 GPU Initialization Checker</h1>
    <div id="results"></div>
    <button onclick="checkGPU()">Check GPU Status</button>
    <button onclick="tryInitTest()">Try Initialize GPU Test</button>
    
    <script type="module">
        window.checkGPU = async function() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Checking GPU Status...</h2>';
            
            const checks = [];
            
            // Check 1: WebGPU API
            if (navigator.gpu) {
                checks.push('<div class="check">✅ WebGPU API available</div>');
            } else {
                checks.push('<div class="error">❌ WebGPU API not available</div>');
                results.innerHTML = checks.join('');
                return;
            }
            
            // Check 2: Request adapter
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (adapter) {
                    checks.push(`<div class="check">✅ GPU Adapter: ${adapter.info?.vendor || 'Unknown'}</div>`);
                    
                    // Check 3: Request device
                    try {
                        const device = await adapter.requestDevice();
                        checks.push('<div class="check">✅ GPU Device created</div>');
                        
                        // Check 4: Window objects
                        checks.push('<h3>Window Objects:</h3>');
                        checks.push(`<div class="${window.gpuRenderer ? 'check' : 'warning'}">${window.gpuRenderer ? '✅' : '⚠️'} window.gpuRenderer: ${window.gpuRenderer ? 'exists' : 'not found'}</div>`);
                        checks.push(`<div class="${window.computeProfiler ? 'check' : 'warning'}">${window.computeProfiler ? '✅' : '⚠️'} window.computeProfiler: ${window.computeProfiler ? 'exists' : 'not found'}</div>`);
                        checks.push(`<div class="${window.profilerOverlay ? 'check' : 'warning'}">${window.profilerOverlay ? '✅' : '⚠️'} window.profilerOverlay: ${window.profilerOverlay ? 'exists' : 'not found'}</div>`);
                        checks.push(`<div class="${window.gpuPerformanceMonitor ? 'check' : 'warning'}">${window.gpuPerformanceMonitor ? '✅' : '⚠️'} window.gpuPerformanceMonitor: ${window.gpuPerformanceMonitor ? 'exists' : 'not found'}</div>`);
                        checks.push(`<div class="${window.gpuPerformanceTest ? 'check' : 'error'}">${window.gpuPerformanceTest ? '✅' : '❌'} window.gpuPerformanceTest: ${window.gpuPerformanceTest ? 'exists' : 'NOT FOUND'}</div>`);
                        
                        // Check 5: Device in renderer
                        if (window.gpuRenderer) {
                            checks.push(`<div class="${window.gpuRenderer.device ? 'check' : 'error'}">${window.gpuRenderer.device ? '✅' : '❌'} GPU Device in renderer: ${window.gpuRenderer.device ? 'exists' : 'missing'}</div>`);
                        }
                        
                        // Check 6: Try to initialize test manually
                        if (!window.gpuPerformanceTest && window.gpuRenderer?.device) {
                            checks.push('<h3>Manual Initialization:</h3>');
                            try {
                                const { GPUPerformanceTest } = await import('./src/test/GPUPerformanceTest.js');
                                window.gpuPerformanceTest = new GPUPerformanceTest(window.gpuRenderer.device);
                                checks.push('<div class="check">✅ GPUPerformanceTest initialized manually!</div>');
                            } catch (e) {
                                checks.push(`<div class="error">❌ Failed to initialize: ${e.message}</div>`);
                            }
                        }
                        
                        device.destroy();
                    } catch (e) {
                        checks.push(`<div class="error">❌ Failed to create device: ${e.message}</div>`);
                    }
                } else {
                    checks.push('<div class="error">❌ No GPU adapter available</div>');
                }
            } catch (e) {
                checks.push(`<div class="error">❌ Failed to request adapter: ${e.message}</div>`);
            }
            
            // Check 7: URL protocol
            checks.push('<h3>Environment:</h3>');
            checks.push(`<div class="${location.protocol === 'https:' ? 'check' : 'warning'}">${location.protocol === 'https:' ? '✅' : '⚠️'} Protocol: ${location.protocol}</div>`);
            checks.push(`<div class="check">📍 URL: ${location.href}</div>`);
            
            results.innerHTML = checks.join('');
        };
        
        window.tryInitTest = async function() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Attempting to initialize GPU Test...</h2>';
            
            try {
                if (!window.gpuRenderer?.device) {
                    results.innerHTML += '<div class="error">❌ GPU device not available. Please load the main application first.</div>';
                    return;
                }
                
                const { GPUPerformanceTest } = await import('./src/test/GPUPerformanceTest.js');
                window.gpuPerformanceTest = new GPUPerformanceTest(window.gpuRenderer.device);
                
                results.innerHTML += '<div class="check">✅ GPUPerformanceTest initialized successfully!</div>';
                results.innerHTML += '<div class="check">You can now run: await window.gpuPerformanceTest.runAllTests()</div>';
            } catch (e) {
                results.innerHTML += `<div class="error">❌ Failed: ${e.message}</div>`;
                results.innerHTML += `<pre>${e.stack}</pre>`;
            }
        };
        
        // Auto-check on load
        setTimeout(() => {
            if (document.readyState === 'complete') {
                checkGPU();
            }
        }, 1000);
    </script>
</body>
</html>
