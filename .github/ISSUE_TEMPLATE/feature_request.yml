name: Feature request
description: Propose a change to the editor or engine
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using now, and why they are not enough.
  - type: checkboxes
    id: offer
    attributes:
      label: Contributing
      options:
        - label: I would like to implement this myself
