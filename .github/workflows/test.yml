name: Automated Testing & Performance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build web bundle
        run: npm run build:web

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run integration tests
        run: npm test -- tests/ThrottlingIntegration.test.js
      
      - name: Run invalidation tests
        run: npm test -- tests/InvalidationManager.test.js
      
      - name: Run cache tests
        run: npm test -- tests/RenderCache.test.js

  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Note: These tests use mocks and don't require GPU
    # Real GPU tests should be run manually on hardware
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance benchmark tests
        run: npm test -- tests/PerformanceBenchmark.test.js
      
      - name: Run performance monitor tests
        run: npm test -- tests/PreviewPerfMonitor.test.js
      
      - name: Store benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            coverage/
            test-results/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-build, unit-tests, integration-tests, performance-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # For matrix jobs, needs.<job-id>.result returns the aggregate result
          # success if all matrix instances succeeded, failure if any failed
          LINT_RESULT="${{ needs.lint-and-build.result }}"
          UNIT_RESULT="${{ needs.unit-tests.result }}"
          INTEGRATION_RESULT="${{ needs.integration-tests.result }}"
          PERFORMANCE_RESULT="${{ needs.performance-tests.result }}"
          
          # Map results to emoji and status text
          get_status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❓ Unknown ($1)" ;;
            esac
          }
          
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint & Build** | $(get_status "$LINT_RESULT") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Unit Tests** (Node 20.x, 22.x) | $(get_status "$UNIT_RESULT") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Integration Tests** | $(get_status "$INTEGRATION_RESULT") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Performance Tests** | $(get_status "$PERFORMANCE_RESULT") |" >> $GITHUB_STEP_SUMMARY
          
          # Exit with failure if any test suite failed
          if [ "$LINT_RESULT" != "success" ] || [ "$UNIT_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ] || [ "$PERFORMANCE_RESULT" != "success" ]; then
            exit 1
          fi

