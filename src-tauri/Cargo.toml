[package]
name = "glsl-node-editor"
version = "0.1.0"
description = "Rhizomium — GLSL/WebGPU node editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The shared application logic lives in lib.rs so it can be reused by the
# desktop binary (main.rs) and the mobile entry point.
name = "glsl_node_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
