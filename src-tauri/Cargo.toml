[package]
name = "rhizomium"
version = "0.1.0"
description = "Rhizomium — GLSL/WebGPU node editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The shared application logic lives in lib.rs so it can be reused by the
# desktop binary (main.rs) and the mobile entry point.
name = "rhizomium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native file and folder pickers for media. Called from Rust only (see
# pick_media_files in src/lib.rs): the webview's own pickers never reveal a
# path, and a project now saves its media by path.
tauri-plugin-dialog = "2"
# Remembers where the editor window was closed and reopens it there (see
# run() in src/lib.rs).
tauri-plugin-window-state = "2"
# The app's connection service (src/bridge): OSC in, NDI out and Live Input
# over a loopback HTTP/WebSocket server on the tokio runtime Tauri already
# runs. NDI itself is loaded at runtime with libloading (src/bridge/ndi.rs), so
# the app builds and runs without the NDI SDK.
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
serde_json = "1"
libloading = "0.8"

[dev-dependencies]
# A WebSocket client for the connection service's tests.
tokio-tungstenite = "0.29"
